            $ref: "#/components/schemas/ApprovalStatus"
        - name: conversation_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Id"
        - name: contact_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: A page of approvals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/approvals/{approval_id}:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    get:
      tags: [approvals]
      operationId: getApproval
      summary: One approval
      responses:
        "200":
          description: The approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /v1/approvals/{approval_id}/approve:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    post:
      tags: [approvals]
      operationId: approveApproval
      summary: Approve (optionally edited) and queue the send
      description: |
        Only a `pending` approval can be approved (`409 approval_not_pending`
        otherwise). The dispatcher re-checks capability and policy at send time. The
        response carries the queued message (`delivery_state: queued`), never `sent`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRequest"
      responses:
        "200":
          description: Approved; message queued.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDecisionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/approvals/{approval_id}/reject:
    parameters:
      - $ref: "#/components/parameters/ApprovalId"
    post:
      tags: [approvals]
