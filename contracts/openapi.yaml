openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Wingman AI API
  version: 1.2.0
  summary: Canonical HTTP contract between the Wingman backend and its clients.
  description: |
    Source of truth for the Wingman backend <-> Android (and any other client) HTTP API.
    Frozen after WING-002 review: any change needs its own versioned contract PR
    (see `contracts/README.md`).

    ## Conventions (apply to every operation; see `docs/adr/`)

    * **Versioning.** All product endpoints live under `/v1`. `GET /health` is unversioned
      liveness. Breaking changes ship under a new prefix (`/v2`); additive changes
      (new optional fields, new endpoints) may land in `/v1` via a contract PR.
    * **IDs** (ADR 0001). Every Wingman resource ID is a lowercase canonical UUID string
      (servers generate UUIDv7). Clients MUST treat IDs as opaque strings and never parse
      them. Platform-assigned identifiers (`external_*`) are arbitrary strings.
    * **Timestamps.** Always UTC, RFC 3339 / ISO-8601 with a literal `Z` suffix, optional
      fractional seconds up to microseconds: `2026-10-31T18:04:05.123456Z`. Offsets such
      as `+00:00` are rejected in requests and never emitted.
    * **Errors** (ADR 0002). Every non-2xx response is `application/problem+json`
      (RFC 9457) using the `Problem` schema with a stable machine-readable `code`.
      Clients branch on `code`, never on `title`/`detail` text.
    * **Pagination** (ADR 0003). List endpoints take `cursor` + `limit` and return
      `{items, next_cursor}`. `next_cursor: null` means the end. Cursors are opaque.
    * **Idempotency** (ADR 0004). Every `POST` requires an `Idempotency-Key` header. A
      replay with the same key and same body returns the original status and body with
      `Idempotent-Replayed: true` and never performs the side effect twice.
    * **Auth.** Bearer JWT (OIDC access token, implemented by WING-004) on every `/v1`
      operation. Resources owned by another user respond `404 not_found`, never `403`,
      so existence is not leaked.
    * **Unknown fields.** Request bodies reject unknown properties (`422
      validation_error`). Response objects may gain new optional properties in `/v1`;
      clients must ignore unknown properties.
    * **Capabilities** (ADR 0005). What a connector can do is advertised per capability
      (`read`, `draft`, `send`, `swipe`, `calendar_write`) with a verification label.
      No endpoint in this contract requires `swipe`, and nothing here infers `send`
      from `read` or from notification access.
    * **Delivery truth.** A message's `delivery_state` only advances on real connector
      acknowledgements. `queued` is never reported as `sent`, and `sent` is never
      reported as `delivered`.
    * **LLM output is advisory.** Drafts and analyses are suggestions. Only the
      automation controller's dispatcher sends, after policy and capability checks.
    * **Device-side connectors** (ADR 0006). Connectors that run on the user's device
      (SMS, notifications) report `connector_event.v1` envelopes through
      `POST /v1/connections/{connection_id}/events` and execute only the send
      instructions the dispatcher placed in the connection's outbox, which they lease
      with `POST /v1/connections/{connection_id}/outbox/claim`. The backend never
      transmits on a device-side transport itself, and no API client can create an
      outbox instruction.

    ## Changelog

    * **1.2.0** (additive, I-017, ADR 0007). Connection pairing: `createConnection`
      (`POST /v1/connections`), `getConnection`, `unpairConnection`
      (`POST /v1/connections/{connection_id}/unpair`). New schemas
      `ConnectionCreateRequest`, `ConnectionUnpairRequest`, `ConnectionUnpairResult`;
      new optional `Connection` fields `device_install_id`, `paired_at`, `unpaired_at`.
      New enum values: `ApprovalReason.paused`; `AgentActionType.lease_expired`,
      `connection_paired`, `connection_unpaired`. Capabilities submitted by a client are
      never stored as `VERIFIED` (ADR 0007). No existing operation, schema, field or enum
      value changed meaning. No new `ErrorCode` values.
    * **1.1.0** (additive). Device event ingest (`ingestConnectorEvent`), device outbox
      (`listOutboxInstructions`, `claimOutboxInstructions`), memory routes
      (`listContactMemories`, `correctMemory`, `deleteMemory`). New schemas
      `ConnectorEventIngestResult`, `OutboxInstruction*`, `OutboxClaim*`, `Memory*`.
      No existing operation, schema or enum changed meaning. No new `ErrorCode` values.
    * **1.0.0**. Initial frozen contract (WING-002, D-004).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8000
    description: Local development (scripts/backend-run.sh)
security:
  - bearerAuth: []
tags:
  - name: health
  - name: users
  - name: preferences
  - name: connections
  - name: conversations
  - name: messages
  - name: drafts
  - name: approvals
  - name: automation
  - name: audit
  - name: memories

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      description: |
        Liveness only. Does not touch the database or Redis so the service reports
        healthy in mock mode. Unauthenticated. Shape matches `backend/app/main.py`.
      security: []
      responses:
        "200":
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/me:
    get:
      tags: [users]
      operationId: getMe
      summary: The authenticated user
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"

  /v1/preferences:
    get:
      tags: [preferences]
      operationId: getPreferences
      summary: User-wide preferences (intent, style, automation)
      description: |
        Returns the current user-wide preferences. A user who never saved preferences
        gets safe defaults: `version: 0`, automation `mode: manual`, all style
        attributes `null` (not inferred).
      responses:
        "200":
          description: Current user-wide preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [preferences]
      operationId: putPreferences
      summary: Replace user-wide preferences
      description: |
        Full replacement. Each successful write creates a new immutable version
        (`version` increments by 1). Send `If-Match: "<version>"` to avoid lost updates;
        a stale version yields `412 precondition_failed`. PUT is naturally idempotent and
        cannot cause a send, so `Idempotency-Key` is not required.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesUpdate"
      responses:
        "200":
          description: Saved; returns the new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/preferences/versions:
    get:
      tags: [preferences]
      operationId: listPreferenceVersions
      summary: Version history of user-wide preferences
      description: Newest version first.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of past versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferencesPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"

  /v1/contacts/{contact_id}/preferences:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    get:
      tags: [preferences]
      operationId: getContactPreferences
      summary: Per-contact override and the effective merged preferences
      description: |
        Precedence: per-contact override field (when non-null) > user-wide preference >
        safe default. Reading or writing an override never modifies user-wide defaults.
      responses:
        "200":
          description: Override (possibly empty) plus effective preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [preferences]
      operationId: putContactPreferences
      summary: Replace the per-contact override
      description: A `null` field means "inherit from user-wide preferences".
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactPreferenceOverrideUpdate"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPreferences"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [preferences]
      operationId: deleteContactPreferences
      summary: Clear the per-contact override (inherit everything)
      responses:
        "204":
          description: Override cleared (also returned if none existed).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /v1/connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: Messaging connections and their advertised capabilities
      description: |
        Each connection carries a `ConnectorCapabilities` document. Clients label a
        platform unavailable unless the capability they need is not `UNSUPPORTED`, and
        must show `UNVERIFIED` capabilities as unverified rather than working.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of connections.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [connections]
      operationId: createConnection
      summary: Pair a connector with the caller's account (added in 1.2.0)
      description: |
        The authenticated app pairs a connector to the caller's account. See ADR 0007.

        * **Device-side platforms** (`sms`, `android_notification`): the request names
          the app installation (`device_install_id`, the same random per-install UUID
          later sent to `claimOutboxInstructions`) and the capabilities the connector
          claims on this device. The server records the platform, display name and
          `device_install_id` binding.
        * **`mock`** (WING-006 simulator, backend-side): only when the server's
          environment is not `prod`; in `prod` the request is `422 validation_error`
          with pointer `/platform`. `device_install_id` and `capabilities` must be
          absent: the server uses the simulator's own capability document.
        * Any other platform is not pairable in 1.2.0 (`422`, schema enum).

        **Capability trust (ADR 0005, ADR 0007).** Capabilities sent by a client are a
        *claim*, never evidence. The server stores each claimed capability as
        `UNSUPPORTED` if claimed `UNSUPPORTED`, otherwise as `UNVERIFIED`; a claimed
        `VERIFIED` (with or without `evidence`) is stored as `UNVERIFIED`, its client
        `evidence` and `verified_at` dropped and a `notes` entry saying so. No API
        operation can make a capability `VERIFIED`; only the server's operator path that
        records a reproduced device run (ADR 0007) can. Therefore a newly paired
        device connection is never eligible for autopilot (its `send` is not
        `VERIFIED`), whatever the request says. The same rule applies to later
        `connection.capabilities_changed` events: a device may lower a capability, never
        raise one to `VERIFIED`.

        **Re-pairing.** While a connection for the same `platform` and
        `device_install_id` is still paired, a new request (new `Idempotency-Key`)
        returns that connection unchanged with `200`: one install has at most one
        paired connection per platform. After `unpairConnection`, pairing again creates
        a new connection. Audit: `connection_paired` (IDs and codes only).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionCreateRequest"
      responses:
        "201":
          description: Paired. Capabilities as stored by the server (never client-`VERIFIED`).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "200":
          description: This install is already paired for this platform; the existing connection, unchanged.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/connections/{connection_id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      tags: [connections]
      operationId: getConnection
      summary: One connection, paired or unpaired (added in 1.2.0)
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /v1/connections/{connection_id}/unpair:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [connections]
      operationId: unpairConnection
      summary: Unpair a connection and cancel its pending automated work (added in 1.2.0)
      description: |
        Effective before the response, in one transaction (ADR 0007):

        * The connection becomes `status: disconnected` with `unpaired_at` set, and every
          capability is stored as `UNSUPPORTED` (notes: unpaired). The dispatcher and the
          claim-time re-check (ADR 0006) therefore cancel anything that still reaches
          them, and `sendMessage` on its conversations is `422 capability_unsupported`.
        * Every **unclaimed** (`pending`) outbox instruction of the connection becomes
          `canceled`, and every `queued` outbound message of the connection (any
          origin: no transport remains for it) becomes `canceled` (audit
          `send_canceled`, reason `connection_unavailable`).
        * Every `pending` approval for the connection's conversations becomes
          `canceled` (audit `approval_canceled`, reason `connection_unavailable`).
        * An instruction a device has already leased cannot be recalled: its message
          stays `sending` and is counted in `in_flight_message_count`. A late outcome
          event for it is still accepted (results are the truth). Other events
          (inbound messages, capability or status changes) on an unpaired connection
          are `422 validation_error` with pointer `/connection_id`.
        * Audit `connection_unpaired` with the counts.

        Nothing is deleted: conversations, messages and audit history stay readable.
        Unpairing an already unpaired connection changes nothing and returns `200` with
        zero counts. Another user's connection is `404`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionUnpairRequest"
      responses:
        "200":
          description: Unpaired (already in effect).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionUnpairResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/connections/{connection_id}/events:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [connections]
      operationId: ingestConnectorEvent
      summary: A device-side connector reports one connector_event.v1 envelope
      description: |
        For connectors that run on the user's device (WING-016 SMS, WING-017
        notifications). The body is exactly one `connector_event.v1` envelope. See
        ADR 0006.

        **Trust boundary (B1).** The device is authenticated as the user, but its
        envelope is untrusted input. The server checks, in this order:

        1. The connection exists and belongs to the caller, and the envelope's
           `user_id` is the caller. Otherwise `404 not_found` (existence is not
           leaked; the body is not inspected further).
        2. The envelope validates against `connector_event.v1`, its `connection_id`
           equals the path, its `platform` equals the connection's platform, and the
           `Idempotency-Key` header equals the envelope's `event_id`. Otherwise
           `422 validation_error`.
        3. `mock.*` events (and `platform: mock`) are accepted only on a `mock`
           connection (WING-006 simulator, WING-025 harness). On any real connection
           they are `422 validation_error` with an error pointer `/type`, so simulated
           success can never be recorded on a real channel.
        4. Send outcome events (`message.send_acknowledged`, `message.send_failed`,
           `message.delivery_receipt` and their `mock.*` counterparts) must name an
           `(outbound_message_id, idempotency_key)` pair that the dispatcher issued to
           **this connection** as an outbox instruction that was leased (claimed).
           A pair that is unknown, belongs to another connection, or was never
           claimed (`pending` or `canceled`) is `422 validation_error` with an error
           pointer under `/payload`. `message.delivery_receipt` carries no
           `idempotency_key`, so it must name an `outbound_message_id` with a leased
           instruction on this connection. A device can only report outcomes of sends
           it was authorized to perform; it can never create an outbound message.

        **Dedup.** The first time an event is accepted the response is `202` with
        `outcome: accepted`. A repeat returns `200` and causes no second message, no
        second state transition and no second audit entry:
        `duplicate_event` for an already-seen `event_id`, `duplicate_message` for an
        inbound message whose `(user_id, platform, external_message_id)` is already
        stored under a different `event_id`. Event dedup is permanent (not limited to
        the 24-hour idempotency retention). This refines ADR 0004 for this route only:
        a repeat answers `200 duplicate_event` instead of replaying the original `202`
        body; a reused key with a different body is still
        `422 idempotency_key_mismatch`.

        **Results are the truth.** A result for an instruction whose lease has expired
        is still accepted and recorded, because the device may really have sent. State
        changes follow `DeliveryState`: acknowledged -> `sent`, failed -> `failed`,
        receipt -> `delivered` (only after `sent`; an early receipt is stored and
        applied once the acknowledgement arrives).

        `connection.capabilities_changed` events update the connection's stored
        capabilities as reported by the device; they cannot authorize anything by
        themselves (ADR 0005 policy still applies at send time).

        Device uploader mapping (WING-016): `2xx` accepted; `400`, `404`, `422`
        rejected (dead letter, never retried); network errors, `409`, `429`, `5xx`
        retry later with the same envelope and key.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/connector_event.v1.json"
      responses:
        "202":
          description: New event accepted and recorded. Downstream work (memory, analysis, drafts) runs asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorEventIngestResult"
        "200":
          description: |
            Already seen (`duplicate_event` or `duplicate_message`). No side effect.
            `Idempotent-Replayed: true` is set for `duplicate_event`.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorEventIngestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/connections/{connection_id}/outbox:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      tags: [connections]
      operationId: listOutboxInstructions
      summary: Read-only view of the connection's send instructions (no message text)
      description: |
        Lists the send instructions the dispatcher created for this connection,
        oldest first (`created_at` ascending, then `id`). For reconciliation and
        diagnostics only: items are `OutboxInstructionSummary` and carry **no text and
        no destination**, so nothing here can be sent. Listing never leases, never
        changes state, and is not an authorization. To obtain an instruction to
        execute, a device must claim it (`claimOutboxInstructions`). See ADR 0006.
        Defaults to `state=pending` when no state is given.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OutboxInstructionState"
      responses:
        "200":
          description: A page of instruction summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxInstructionPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/connections/{connection_id}/outbox/claim:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [connections]
      operationId: claimOutboxInstructions
      summary: Lease authorized send instructions for this device to execute
      description: |
        The pull half of the device downlink (ADR 0006). The device polls this route;
        the backend never pushes a send. Instructions are created **only by the
        dispatcher (WING-011)** after the automation policy, approval and capability
        checks; there is no API operation that creates one, and LLM output never
        reaches this route except as text the dispatcher already authorized.

        **What a claim does, atomically per instruction:**

        * Re-checks, at claim time, the same policy the dispatcher applied, using the
          message's `origin`. Global pause and the contact's pause/takeover state
          cancel exactly what those actions themselves cancel: never a `user_manual`
          send (`sendMessage` is allowed while paused or taken over). Any instruction
          is canceled if the connection's `send` capability is now `UNSUPPORTED`, and
          an `autopilot` instruction also if `send` is no longer `VERIFIED`
          (ADR 0005). An instruction that no longer passes becomes `canceled` (its
          message `canceled`) and is not returned.
        * Leases each returned `pending` instruction to the calling
          `device_install_id`: state `leased`, `leased_at` now, `lease_expires_at` set
          by the server (default 120 s, bounds 30 to 600 s). The message moves
          `queued` -> `sending`, audit `send_attempted`.
        * Also returns instructions already leased to the **same**
          `device_install_id` whose lease has not expired (same lease, not extended),
          so a device that lost a response can recover them with a fresh key.

        **Exclusivity.** An instruction is leased at most once, ever: two devices
        polling concurrently can never both receive it (implement with row locks,
        e.g. `FOR UPDATE SKIP LOCKED`). A lease is never renewed, transferred or
        re-issued. If the lease expires without a result the instruction becomes
        `expired` and the outcome is **unknown**: the message stays `sending`, is
        never reported `sent`, and is never retried automatically (it may have gone
        out). A retry is a **new** instruction with a new attempt number and a new
        `idempotency_key` (D-006), created by the dispatcher only after a definitive
        `send_failed` with `retryable: true`.

        **Device obligations.** Start the transport attempt only before the lease
        deadline, computed on the device clock as
        `local_now + (lease_expires_at - server_time)` minus a safety margin. If it
        cannot start in time, it must not send and reports `message.send_failed`
        with `failure.code: timeout`, `retryable: true`. It performs at most one
        transport attempt per `idempotency_key` (D-006), and reports exactly one
        outcome event per instruction through `ingestConnectorEvent`, echoing
        `outbound_message_id` and `idempotency_key`.

        **Idempotency.** Replaying the same `Idempotency-Key` with the same body
        returns the original response (the same instructions) with
        `Idempotent-Replayed: true` and leases nothing new. Devices persist the key
        before sending the request.

        Connections whose connector runs inside the backend never have instructions:
        the claim returns an empty list.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboxClaimRequest"
      responses:
        "200":
          description: The leased instructions (possibly none).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxClaimResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      summary: Unified inbox
      description: Ordered by `last_activity_at` descending, then `id`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: platform
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Platform"
        - name: intent
          in: query
          required: false
          description: Filter by effective intent mode.
          schema:
            $ref: "#/components/schemas/IntentMode"
        - name: automation_mode
          in: query
          required: false
          description: Filter by effective automation mode.
          schema:
            $ref: "#/components/schemas/AutomationMode"
        - name: stage
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ConversationStage"
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/conversations/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [conversations]
      operationId: getConversation
      summary: One conversation with its latest advisory analysis
      responses:
        "200":
          description: Conversation detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /v1/conversations/{conversation_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [messages]
      operationId: listMessages
      summary: Messages in a conversation
      description: |
        Chronological (`created_at` ascending, then `id`). The first page (no cursor)
        starts at the oldest message; follow `next_cursor` to move forward in time.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [messages]
      operationId: sendMessage
      summary: User-authored send (goes through the dispatcher)
      description: |
        Queues a message written by the user. The request is handed to the single
        dispatcher, which checks the connection's `send` capability (must not be
        `UNSUPPORTED`) and records the outcome. Returns `202` with
        `delivery_state: queued`; poll the message or the audit log for `sent`,
        `delivered` or `failed`. Allowed while the contact is paused or taken over,
        because the user is the author.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "202":
          description: Accepted and queued. Not yet sent.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/conversations/{conversation_id}/drafts:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [drafts]
      operationId: createDraft
      summary: Ask the AI for a suggested reply (never sends)
      description: |
        Generates a grounded draft for the user to read, edit, and send manually. The
        draft is a suggestion only: this endpoint never queues a send and never creates
        an approval. The result may be `no_send` or `ask_user` when context is
        insufficient. Idempotency-Key prevents paying for duplicate generations.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftCreateRequest"
      responses:
        "201":
          description: Draft created.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Draft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

  /v1/approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: Approval queue
      description: Newest first. Defaults to `status=pending` when no status is given.
