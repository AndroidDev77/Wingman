  /v1/connections/{connection_id}/outbox/claim:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [connections]
      operationId: claimOutboxInstructions
      summary: Lease authorized send instructions for this device to execute
      description: |
        The pull half of the device downlink (ADR 0006). The device polls this route;
        the backend never pushes a send. Instructions are created **only by the
        dispatcher (WING-011)** after the automation policy, approval and capability
        checks; there is no API operation that creates one, and LLM output never
        reaches this route except as text the dispatcher already authorized.

        **Install binding (1.3.0 note, D-017, ADR 0007).** Only the install the
        connection was paired with may claim. A claim from any other
        `device_install_id`, on an unpaired connection, or on a device-side connection
        that was never paired is `422 validation_error` with an error pointer
        `/device_install_id`. The check runs before anything is dispatched, canceled,
        leased or recovered, so a rejected install takes nothing. `404` is not used
        because the connection is the caller's own. A backend-side connection without a
        binding (`mock`) answers `200` with an empty list.

        **What a claim does, atomically per instruction:**

        * Re-checks, at claim time, the same policy the dispatcher applied, using the
          message's `origin`. Global pause and the contact's pause/takeover state
          cancel exactly what those actions themselves cancel: never a `user_manual`
          send (`sendMessage` is allowed while paused or taken over). Any instruction
          is canceled if the connection's `send` capability is now `UNSUPPORTED`, and
          an `autopilot` instruction also if `send` is no longer `VERIFIED` or the
          connection is experimental and not operator-verified (ADR 0005, ADR 0008).
          An instruction that no longer passes becomes `canceled` (its
          message `canceled`) and is not returned.
        * Leases each returned `pending` instruction to the calling
          `device_install_id`: state `leased`, `leased_at` now, `lease_expires_at` set
          by the server (default 120 s, bounds 30 to 600 s). The message moves
          `queued` -> `sending`, audit `send_attempted`.
        * Also returns instructions already leased to the **same**
          `device_install_id` whose lease has not expired (same lease, not extended),
          so a device that lost a response can recover them with a fresh key.

        **Exclusivity.** An instruction is leased at most once, ever: two devices
        polling concurrently can never both receive it (implement with row locks,
        e.g. `FOR UPDATE SKIP LOCKED`). A lease is never renewed, transferred or
        re-issued. If the lease expires without a result the instruction becomes
        `expired` and the outcome is **unknown**: the message stays `sending`, is
        never reported `sent`, and is never retried automatically (it may have gone
        out). A retry is a **new** instruction with a new attempt number and a new
        `idempotency_key` (D-006), created by the dispatcher only after a definitive
        `send_failed` with `retryable: true`.

        **Device obligations.** Start the transport attempt only before the lease
        deadline, computed on the device clock as
        `local_now + (lease_expires_at - server_time)` minus a safety margin. If it
        cannot start in time, it must not send and reports `message.send_failed`
        with `failure.code: timeout`, `retryable: true`. It performs at most one
        transport attempt per `idempotency_key` (D-006), and reports exactly one
        outcome event per instruction through `ingestConnectorEvent`, echoing
        `outbound_message_id` and `idempotency_key`.

        **Idempotency.** Replaying the same `Idempotency-Key` with the same body
        returns the original response (the same instructions) with
        `Idempotent-Replayed: true` and leases nothing new. Devices persist the key
        before sending the request.

        Connections whose connector runs inside the backend never have instructions:
        the claim returns an empty list.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutboxClaimRequest"
      responses:
        "200":
          description: The leased instructions (possibly none).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutboxClaimResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"

