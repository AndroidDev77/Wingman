        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/memories/{memory_id}:
    parameters:
      - $ref: "#/components/parameters/MemoryId"
    put:
      tags: [memories]
      operationId: correctMemory
      summary: Correct a fact (a user correction supersedes it; history is kept)
      description: |
        Creates a new memory with `origin: user_correction`, `basis: stated`,
        `confidence: 1`, the same `key` and the same `source_message_ids`. It
        supersedes this fact and every other active fact with the same key, and is
        returned (its `id` differs from `memory_id`). Repeating the same correction
        (same content, compared case- and whitespace-insensitively) returns the
        existing correction and creates nothing, so PUT stays idempotent and takes no
        `Idempotency-Key` (ADR 0004). Correcting a summary, or content that is blank
        after trimming, is `422 validation_error`. A deleted, missing or other user's
        memory is `404 not_found`. A later message from the contact can supersede a
        correction again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCorrection"
      responses:
        "200":
          description: The correcting memory (new or the existing identical one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [memories]
      operationId: deleteMemory
      summary: Forget a memory
      description: |
        Soft delete. The memory is excluded from every later listing and from
        retrieval for drafts, and re-extracting the same messages cannot bring it
        back (only new evidence can). Deleting the active fact does not reactivate an
        older superseded one. Idempotent: deleting an already-deleted memory is also
        `204`. A missing or other user's memory is `404 not_found`.
      responses:
        "204":
          description: Deleted (also when it was already deleted).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /v1/agent-actions:
    get:
      tags: [audit]
      operationId: listAgentActions
      summary: Audit timeline
      description: |
        Append-only record of everything the agent, user, dispatcher and connectors did.
        Newest first. `details` is redacted: never contains message bodies, tokens, or
        phone numbers.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: conversation_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Id"
        - name: contact_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Id"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgentActionType"
      responses:
        "200":
          description: A page of audit entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentActionPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/connections/{connection_id}/experimental-consent/revoke:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      tags: [connections]
      operationId: revokeExperimentalConsent
      summary: Withdraw the ban-risk consent of an experimental connection (added in 1.3.0)
      description: |
        Only for an experimental connection (`transport: unofficial_api`); any other
        connection is `422 validation_error` at `/connection_id`. Effective before the
        response, in one transaction, exactly like `unpairConnection` (ADR 0007): the
        connection becomes `disconnected` with every capability `UNSUPPORTED`, its
        unclaimed instructions, queued sends, pending approvals and pending assisted
        deliveries are canceled (audited, reason `connection_unavailable`), a leased
        send cannot be recalled and its outcome is still accepted. In addition the
        consent gets `revoked_at` (audit `experimental_consent_revoked`) and
        `auto_swipe_enabled` becomes false. The device must then delete the platform
        session it holds. To use the connector again the user pairs again with a new
        consent. Revoking twice changes nothing and returns zero counts.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionUnpairRequest"
      responses:
        "200":
          description: Consent revoked and the connection unpaired (already in effect).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionUnpairResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/connections/{connection_id}/settings:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    put:
      tags: [connections]
      operationId: putConnectionSettings
      summary: The user's per-connection settings, e.g. auto-swipe (added in 1.3.0)
      description: |
        Full replacement of the user-controlled settings of one connection. PUT is
        idempotent and causes no send or swipe, so no `Idempotency-Key`.
        `auto_swipe_enabled: true` is accepted only while the swipe execution gate
        could pass for this connection (ADR 0008): it is paired, its `swipe`
        capability is `VERIFIED`, and it is not experimental-unverified. Otherwise
        `422 swipe_execution_disabled`. Turning it off is always allowed. The gate is
        evaluated again on every execution request, so a later capability change
        still stops execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionSettingsUpdate"
      responses:
        "200":
          description: Saved; the connection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/conversations/{conversation_id}/read:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [conversations]
      operationId: markConversationRead
      summary: Mark a conversation read (added in 1.3.0, I-022)
      description: |
        Sets `unread_count` to 0 and returns the conversation. Idempotent on state:
        marking an already read conversation changes nothing and still returns `200`
        (and the same `Idempotency-Key` replays the stored response). Never sends,
        never changes messages, approvals or automation. Another user's conversation
        is `404`. The body is optional and, when present, empty.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
      responses:
        "200":
          description: The conversation, now read.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/inbound-notices:
    get:
      tags: [assisted]
      operationId: listInboundNotices
      summary: Inbound events shown but never replied to (added in 1.3.0)
      description: |
        Newest first (`occurred_at` descending, then `id`). Matches, likes and
        comments, expiry and system notices, unknown kinds, and any inbound event whose
        sender identity is `unlinked` or `ambiguous` or whose content is truncated or
        hidden (ADR 0008). A notice is never drafted, approved, auto-replied or merged
        into a contact or conversation. `text` is private: never log.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: connection_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: A page of notices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboundNoticePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/assisted-deliveries:
    get:
      tags: [assisted]
      operationId: listAssistedDeliveries
      summary: Drafts waiting for the user to send them by hand (added in 1.3.0)
      description: |
        Newest first. Defaults to `status=pending`. An assisted delivery is the
        draft-only instruction the dispatcher queues when a connection on a dating or
        iMessage platform cannot send (`send: UNSUPPORTED`, ADR 0008). The app or the
        device shows `text`, copies it or opens the platform app at the conversation,
        and the user confirms with `confirmAssistedDelivery` after sending it there
        themselves. Nothing here is ever transmitted by Wingman. `text` is private.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AssistedDeliveryStatus"
        - name: conversation_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: A page of assisted deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistedDeliveryPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/assisted-deliveries/{assisted_delivery_id}/confirm:
    parameters:
      - $ref: "#/components/parameters/AssistedDeliveryId"
    post:
      tags: [assisted]
      operationId: confirmAssistedDelivery
      summary: The user says "I sent it" (added in 1.3.0)
      description: |
        Records the user's own report that they sent the draft (or their edit of it)
        in the platform app. Creates one outbound `Message` with `origin:
        assisted_draft` and `delivery_state: user_reported_sent`: never `sent` or
        `delivered`, no `sent_at`, no connector event (Wingman observed nothing). The
        assisted delivery becomes `user_reported_sent` (audit
        `assisted_delivery_confirmed`, actor `user`). Only a `pending` one can be
        confirmed (`409 assisted_delivery_not_pending` otherwise).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistedDeliveryConfirmRequest"
      responses:
        "200":
          description: Recorded as reported by the user.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistedDeliveryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/assisted-deliveries/{assisted_delivery_id}/dismiss:
    parameters:
      - $ref: "#/components/parameters/AssistedDeliveryId"
    post:
      tags: [assisted]
      operationId: dismissAssistedDelivery
      summary: The user will not send this draft (added in 1.3.0)
      description: |
        Only a `pending` assisted delivery (`409 assisted_delivery_not_pending`
        otherwise). Nothing is recorded as sent. Audit `assisted_delivery_dismissed`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: Dismissed.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistedDeliveryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/identity-links:
    post:
      tags: [identity]
      operationId: createIdentityLink
      summary: The user links two contacts as the same person (added in 1.3.0, WING-032)
      description: |
        An explicit, user-made link, e.g. between a Hinge match and a phone contact.
        The server never creates, suggests-and-applies or infers a link (not from
        names, numbers, photos or model output; ADR 0008). Both contacts must be the
        caller's (`404` otherwise) and different (`422` at `/linked_contact_id`). A
        link is unordered: linking the same pair again (either order) returns the
        existing link with `200`. Audit `identity_link_created` (actor `user`). A link
        changes no conversation, message, memory or automation setting by itself.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityLinkCreateRequest"
      responses:
        "201":
          description: Linked.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityLink"
        "200":
          description: These contacts were already linked; the existing link.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/contacts/{contact_id}/identity-links:
    parameters:
      - $ref: "#/components/parameters/ContactId"
    get:
      tags: [identity]
      operationId: listContactIdentityLinks
      summary: Links the user made for this contact (added in 1.3.0)
      description: Newest first. Includes links where the contact is on either side.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of links.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityLinkPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/identity-links/{identity_link_id}:
    parameters:
      - $ref: "#/components/parameters/IdentityLinkId"
    delete:
      tags: [identity]
      operationId: deleteIdentityLink
      summary: Remove a link (added in 1.3.0)
      description: |
        Removes the link; audit `identity_link_deleted`. A missing or another user's
        link is `404 not_found` (so deleting twice is `404` the second time).
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"

  /v1/profiles:
    post:
      tags: [profiles]
      operationId: importProfile
      summary: Import a dating profile for review (added in 1.3.0, WING-019/031)
      description: |
        Stores a normalized `Profile` from `manual` entry (a profile the user shares)
        or a `fixture` (deterministic tests and demos). `device` import (a device-side
        connector reading profiles) needs `connection_id` of a paired connection on the
        same platform whose `profile_read` capability is not `UNSUPPORTED`; otherwise
        `422` at `/connection_id`. Only attributes the source provided are stored;
        nothing is inferred (never from photos). Importing the same
        `(provider, external_profile_id)` again replaces the content and provenance and
        returns `200`. Audit `profile_imported`. Never swipes.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileImportRequest"
      responses:
        "201":
          description: Imported.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "200":
          description: Already known; updated from this import.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/profiles/review-queue:
    get:
      tags: [profiles]
      operationId: listProfileReviewQueue
      summary: Profiles waiting for the user's decision (added in 1.3.0, ranked since 1.3.1)
      description: |
        Profiles with no recorded decision other than `skip`, ranked by compatibility
        (1.3.1, WING-019). Each item carries its latest `Evaluation` and `stale`.

        **Evaluation.** Before ranking, the server makes sure each candidate has a
        current evaluation against the user's current preferences; a missing or
        out-of-date one is replaced by a **new** evaluation (earlier evaluations and
        decisions are never rewritten). So `latest_evaluation` is normally non-null
        here. Evaluations are advisory and never authorize a swipe.

        **Ranking** (stable across pages; the cursor is opaque):
        1. Fresh profiles (`stale: false`): higher `score` first, unscored (`score:
           null`) after every scored one, then higher `confidence`, then newest import.
        2. Stale profiles (`stale: true`), in the same order. They can be decided on,
           but `requestProfileActionExecution` refuses to execute them.
        3. Only with `include_excluded=true`: excluded profiles, in the same order.

        **Exclusion.** A profile whose latest evaluation has a non-empty
        `dealbreakers_hit` (a stated attribute matched one of the user's dealbreakers;
        its `score` is 0) is **excluded**: it is left out of the queue unless
        `include_excluded=true`. Excluding is not a decision: nothing is recorded or
        executed, and the profile comes back if the user's dealbreakers change. The
        server ranks at most the 500 newest undecided profiles per request.

        A cursor belongs to one combination of `provider` and `include_excluded`;
        reusing it with another is `422 validation_error`.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: provider
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProfileProvider"
        - name: include_excluded
          in: query
          required: false
          description: |
            (1.3.1) Also list profiles excluded by a dealbreaker hit, after every other
            profile, each with its `dealbreakers_hit` and dealbreaker reason. Default
            `false`: they are left out.
          schema:
            type: boolean
            default: false
          examples:
            default:
              summary: Excluded profiles are left out
              value: false
            show_excluded:
              summary: Show excluded profiles last (see `profiles.review_queue.include_excluded.page.json`)
              value: true
      responses:
        "200":
          description: A page of profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/profiles/{profile_id}/decision:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    post:
      tags: [profiles]
      operationId: recordProfileDecision
      summary: Record the user's like, pass, skip or superlike (added in 1.3.0)
      description: |
        Records the **user's decision** only; nothing is executed on the platform.
        The new `ProfileAction` has `execution: not_executable` until
        `requestProfileActionExecution` passes the gate. `connection_id`, when given,
        must be the caller's connection on the profile's platform (`422` at
        `/connection_id`). The `Idempotency-Key` is stored as the action's
        `idempotency_key`. Audit `profile_decision_recorded`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileDecisionRequest"
      responses:
        "201":
          description: Recorded.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

  /v1/profile-actions/{profile_action_id}/execute:
    parameters:
      - $ref: "#/components/parameters/ProfileActionId"
    post:
      tags: [profiles]
      operationId: requestProfileActionExecution
      summary: Ask for a recorded decision to be executed on the platform (added in 1.3.0)
      description: |
        The swipe execution gate (ADR 0008). Passes only if **all** hold, else
        `422 swipe_execution_disabled` (an `errors` entry names the failed check):
        the action is `like`, `pass` or `superlike` (never `skip`); it has a
        `connection_id`; that connection is paired and connected; its `swipe`
        capability is `VERIFIED` (operator evidence, ADR 0007); the user turned
        `auto_swipe_enabled` on for it; it is not experimental-unverified (an
        experimental connection needs `experimental_verified_at`); global automation
        is not paused; the profile is on the connection's platform and not `stale`;
        and no other action for this profile is `queued` or `executed`.
        On success `execution` becomes `queued` (audit `profile_action_queued`):
        accepted for execution, **not** executed. Only a device-reported outcome may
        later set `executed`, `failed` or `unknown` (WING-031). Requesting again for a
        `queued` action returns it unchanged.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionUnpairRequest"
      responses:
        "200":
          description: Queued for execution (not executed).
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OIDC access token. WING-004 verifies issuer, audience, expiry and signature.
        The `sub` claim maps to exactly one Wingman user. A dev-only stub may exist but
        must be impossible to enable when `WINGMAN_ENV=prod`.

  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `next_cursor`. Omit for the first page.
      schema:
        $ref: "#/components/schemas/Cursor"
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated unique key (a fresh UUIDv4 is recommended) per logical action.
        Scope: (user, HTTP method, route template). Retained at least 24 hours.
        Same key + same body -> original response replayed with `Idempotent-Replayed:
        true`, no second side effect. Same key + different body -> `422
        idempotency_key_mismatch`. Same key while the first request is still running ->
        `409 idempotency_key_in_progress` with `Retry-After`. Missing -> `400
        idempotency_key_required`.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Quoted current `version`, e.g. `"3"`. Mismatch -> `412 precondition_failed`.
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    ContactId:
      name: contact_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"

    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    MemoryId:
      name: memory_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    AssistedDeliveryId:
      name: assisted_delivery_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    IdentityLinkId:
      name: identity_link_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ProfileActionId:
      name: profile_action_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"

  headers:
    IdempotentReplayed:
      description: Present and `true` when this response is a replay of an earlier request.
      schema:
        type: boolean
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0

  requestBodies:
    AutomationActionBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AutomationActionRequest"

  responses:
    Error:
      description: Any error. See `ErrorCode`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: Malformed request, e.g. missing `Idempotency-Key`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: Missing, invalid or expired bearer token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Does not exist or belongs to another user.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: State conflict (e.g. approval not pending, idempotency key in progress).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: '`If-Match` did not match the current version.'
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: Body or parameters failed validation, or capability/policy rejects the action.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: User send/generation limit reached.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GlobalAutomationStateOk:
      description: State after the action (already in effect).
      headers:
        Idempotent-Replayed:
          $ref: "#/components/headers/IdempotentReplayed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GlobalAutomationState"
    ContactAutomationStateOk:
      description: State after the action (already in effect).
      headers:
        Idempotent-Replayed:
          $ref: "#/components/headers/IdempotentReplayed"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ContactAutomationState"

  schemas:
    # ---------------------------------------------------------------- primitives
    Id:
      description: |
        Wingman resource ID. Lowercase canonical UUID (servers generate UUIDv7).
        Opaque to clients: compare for equality only.
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      examples: ["0192f3a0-7c1e-7b2a-9d4e-1a2b3c4d5e6f"]
    Timestamp:
      description: UTC instant, RFC 3339 with a literal `Z`. Up to microsecond precision.
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$'
      examples: ["2026-10-31T18:04:05.123456Z"]
    Cursor:
      description: Opaque pagination cursor. Do not parse or construct.
      type: string
      minLength: 1
      maxLength: 512
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
      pattern: "^[A-Za-z0-9._:-]{8,128}$"
    Platform:
      description: |
        Messaging platform key: lowercase snake_case. Known values: `mock` (WING-006
        simulator), `sms` (WING-016), `android_notification` (WING-017), `imessage`
        (WING-020/030 Mac companion), `tinder`, `bumble`, `hinge` (WING-027 to 029;
        pairable since 1.3.0). Adding a platform does not change this contract; its
        capabilities say what it can do.
      type: string
      pattern: "^[a-z][a-z0-9_]{1,31}$"
      examples: [sms, mock]
    ExternalId:
      description: Platform-assigned identifier. Arbitrary, opaque, never a Wingman `Id`.
      type: string
      minLength: 1
      maxLength: 256

    # ---------------------------------------------------------------- enums
    IntentMode:
      description: |
        User's dating intent (WING-007). `custom` requires `custom_description`.
        Never inferred from the other person.
      type: string
      enum: [serious, casual_dating, casual_physical, open, custom]
    AutomationMode:
      description: |
        (WING-011.) `manual`: agent never sends; drafts only on request.
        `assisted`: agent may propose drafts into the approval queue; nothing is sent
        without explicit approval. `autopilot`: agent may send without approval, only
        on connections whose `send` capability is `VERIFIED`, within active hours and
        limits, and still routes `approval_required_for` cases to the queue.
        Default is `manual` (automation off until the user enables it).
      type: string
      enum: [manual, assisted, autopilot]
    ConversationStage:
      description: |
        (WING-009.) Advisory classification only; never triggers a send.
        `confirmed` requires explicit confirmation evidence, never just a proposed time.
      type: string
      enum: [new, introduction, rapport, interest, date_proposal, scheduling, confirmed, follow_up, paused]
    DateProposalState:
      description: |
        (WING-018.) `suggested`: agent idea, not shared with the contact.
        `offered`: sent to the contact. `accepted`: contact agreed in principle.
        `confirmed`: explicit confirmation of time and place by both sides (never
        inferred from a proposed time alone). `canceled`: terminal.
      type: string
      enum: [suggested, offered, accepted, confirmed, canceled]
    DeliveryState:
      description: |
        Message lifecycle. Inbound messages are always `received`. Outbound:
        `queued` (accepted by the dispatcher, not yet handed to a connector) ->
        `sending` (handed to the connector, awaiting acknowledgement) -> `sent`
        (connector acknowledged handoff to the transport) -> `delivered` (platform
        delivery receipt observed; only for connectors that report receipts).
        `failed`: an attempt failed; may be retried (back to `queued`) within the retry
        budget. `dead_lettered`: retries exhausted; terminal. `canceled`: removed from
        the queue before `sending` (e.g. by pause/takeover); terminal.
        `user_reported_sent` (1.3.0, ADR 0008): the user said they sent an assisted
        draft by hand in the platform app (`confirmAssistedDelivery`). Wingman did not
        transmit it and no connector confirmed it, so it is never shown as `sent` or
        `delivered`, never has `sent_at`/`delivered_at`, and is terminal. Only
        `assisted_draft` messages have it.
        A message is never reported as `sent` or `delivered` without the matching
        connector event.
      type: string
      enum: [received, queued, sending, sent, delivered, failed, dead_lettered, canceled, user_reported_sent]
    MessageDirection:
      type: string
      enum: [inbound, outbound]
    MessageOrigin:
      description: |
        `contact`: inbound from the other person. `user_manual`: typed and sent by the
        user. `approved_draft`: agent draft sent after explicit approval.
        `autopilot`: agent draft sent without per-message approval under autopilot policy.
        `assisted_draft` (1.3.0): an agent draft the user sent by hand in the platform
        app and reported with `confirmAssistedDelivery`; always `user_reported_sent`.
      type: string
      enum: [contact, user_manual, approved_draft, autopilot, assisted_draft]
    ApprovalStatus:
      description: |
        `pending` -> `approved` | `rejected` | `expired` | `canceled`. All but `pending`
        are terminal. `canceled`: superseded (newer inbound message, pause, or takeover).
      type: string
      enum: [pending, approved, rejected, expired, canceled]
    ApprovalReason:
      description: |
        Why a draft needs human approval. `paused` (1.2.0): global or contact automation
        is paused, so nothing is sent without approval (D-014); before 1.2.0 this was
        reported as `user_rule`. Clients must tolerate values added in later minor
        versions.
      type: string
      enum:
        - assisted_mode
        - sensitive_content
        - date_or_commitment
        - low_confidence
        - first_message
        - outside_active_hours
        - capability_unverified
        - send_limit_reached
        - user_rule
        - paused
    DraftDecision:
      description: |
        `send_candidate`: `text` is a usable suggested reply. `no_send`: the agent
        recommends not replying now. `ask_user`: the agent needs information only the
        user has (see `question_for_user`); `text` is null.
      type: string
      enum: [send_candidate, no_send, ask_user]
    ContactAutomationStatus:
      description: |
        `active`: effective automation mode applies. `paused`: no automated sends;
        the agent may still queue drafts for approval. `taken_over`: the user is
        driving; no automated sends and no agent-initiated drafts or approvals
        until resumed (the user can still request drafts and send manually).
      type: string
      enum: [active, paused, taken_over]
    GlobalAutomationStatus:
      type: string
      enum: [active, paused]
    Actor:
      type: string
      enum: [user, agent, dispatcher, connector, system]
    AgentActionType:
      description: |
        Audit entry kinds. Send-related types mirror `DeliveryState` transitions.
        Added in 1.2.0: `lease_expired` (a device lease lapsed with no outcome; the
        outcome is unknown, the message stays `sending` and is never retried
        automatically, ADR 0006; actor `system`), `connection_paired` and
        `connection_unpaired` (ADR 0007). Added in 1.3.0 (ADR 0008): `notice_received`
        (an inbound event stored as a notice, never replied to),
        `assisted_delivery_queued` / `_confirmed` / `_dismissed` / `_canceled`
        (draft-only delivery; `_confirmed` means the user *reported* sending it),
        `experimental_consent_recorded` / `_revoked`, `identity_link_created` /
        `_deleted` (user actions only), `profile_imported`,
        `profile_decision_recorded`, `profile_action_queued` (swipe execution passed
        the gate; not executed yet). Clients must tolerate values added in later minor
        versions.
      type: string
      enum:
        - message_received
        - analysis_updated
        - draft_generated
        - approval_requested
        - approval_approved
        - approval_rejected
        - approval_expired
        - approval_canceled
        - policy_blocked
        - send_queued
        - send_attempted
        - send_acknowledged
        - delivery_confirmed
        - send_failed
        - send_dead_lettered
        - send_canceled
        - automation_paused
        - automation_resumed
        - automation_takeover
        - preferences_updated
        - lease_expired
        - connection_paired
        - connection_unpaired
        - notice_received
        - assisted_delivery_queued
        - assisted_delivery_confirmed
        - assisted_delivery_dismissed
        - assisted_delivery_canceled
        - experimental_consent_recorded
        - experimental_consent_revoked
        - identity_link_created
        - identity_link_deleted
        - profile_imported
        - profile_decision_recorded
        - profile_action_queued
    ConnectionStatus:
      type: string
      enum: [connected, disconnected, error]
    ErrorCode:
      description: |
        Stable machine-readable error codes. Clients that see an unknown code must fall
        back to handling by HTTP status.
      type: string
      enum:
        - validation_error            # 422 body/param invalid (incl. unknown enum values, unknown fields)
        - idempotency_key_required    # 400
        - idempotency_key_mismatch    # 422 same key, different body
        - idempotency_key_in_progress # 409
        - unauthenticated             # 401
        - not_found                   # 404 (also for other users' resources)
        - precondition_failed         # 412 If-Match mismatch
        - approval_not_pending        # 409
        - automation_paused           # 409 action not allowed in current automation state
        - capability_unsupported      # 422 connection does not support the operation
        - capability_unverified       # 422 operation needs a VERIFIED capability (e.g. autopilot)
        - connection_unavailable      # 409 connection disconnected/error
        - rate_limited                # 429
        - upstream_unavailable        # 503 LLM provider/connector unreachable
        - internal_error              # 500
        - experimental_consent_required  # 422 (1.3.0) experimental connection without a recorded user consent
        - assisted_delivery_not_pending  # 409 (1.3.0) assisted delivery already confirmed, dismissed or canceled
        - swipe_execution_disabled       # 422 (1.3.0) the swipe execution gate refused (ADR 0008)

    # ---------------------------------------------------------------- errors
    Problem:
      description: RFC 9457 problem details plus Wingman extensions `code`, `request_id`, `errors`.
      type: object
      required: [type, title, status, code]
      properties:
        type:
          description: URI reference identifying the problem type, `https://wingman.invalid/problems/<code>`.
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: "#/components/schemas/ErrorCode"
        request_id:
          type: string
        errors:
          description: Field-level validation errors (only for `validation_error`).
          type: array
          items:
            type: object
            required: [pointer, message]
            properties:
              pointer:
                description: JSON Pointer (RFC 6901) into the request body, or `query:<name>` / `header:<name>`.
                type: string
              message:
                type: string

    # ---------------------------------------------------------------- health
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, version, env, time]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
        env:
          type: string
          enum: [dev, test, prod]
        time:
          $ref: "#/components/schemas/Timestamp"

    # ---------------------------------------------------------------- users
    User:
      type: object
      required: [id, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        email:
          type: [string, "null"]
          format: email
        display_name:
          type: [string, "null"]
          maxLength: 120
        created_at:
          $ref: "#/components/schemas/Timestamp"

    # ---------------------------------------------------------------- preferences
    Intent:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/IntentMode"
        custom_description:
          description: Required (non-empty) when `mode` is `custom`; must be null otherwise.
          type: [string, "null"]
          maxLength: 500
      if:
        properties:
          mode:
            const: custom
      then:
        required: [custom_description]
        properties:
          custom_description:
            type: string
            minLength: 1
      else:
        properties:
          custom_description:
            type: "null"
    StyleProfile:
      description: |
        (WING-007.) Every attribute is nullable: `null` means "not configured"; the
        generator then uses a neutral default and must not infer a user-specific style.
      type: object
      additionalProperties: false
      properties:
        punctuation:
          type: [string, "null"]
          enum: [minimal, standard, expressive, null]
        emoji_frequency:
          type: [string, "null"]
          enum: [none, rare, occasional, frequent, null]
        brevity:
          type: [string, "null"]
          enum: [very_short, short, medium, long, null]
        humor:
          type: [string, "null"]
          enum: [none, light, playful, witty, null]
        tone:
          type: [string, "null"]
          enum: [warm, direct, playful, flirty, reserved, formal, null]
        response_pace:
          description: How quickly replies should go out under automation; bounds in `AutomationSettings.reply_delay_seconds`.
          type: [string, "null"]
          enum: [immediate, prompt, relaxed, slow, null]
        style_samples:
          description: Example messages the user wrote, provided explicitly by the user.
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
    ActiveHours:
      description: Windows in which automated sends may go out. Outside them, drafts go to approval.
      type: object
      additionalProperties: false
      required: [timezone, windows]
      properties:
        timezone:
          description: IANA time zone name, e.g. `America/Chicago`.
          type: string
          minLength: 1
          maxLength: 64
        windows:
          type: array
          minItems: 1
          maxItems: 14
          items:
            type: object
            additionalProperties: false
            required: [days, start, end]
            properties:
              days:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  enum: [mon, tue, wed, thu, fri, sat, sun]
              start:
                description: Local wall-clock `HH:MM` (24h), inclusive.
                type: string
                pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
              end:
                description: Local wall-clock `HH:MM` (24h), exclusive. `end` < `start` wraps past midnight.
                type: string
                pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    AutomationSettings:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/AutomationMode"
        active_hours:
          description: Null means no time restriction.
          anyOf:
            - $ref: "#/components/schemas/ActiveHours"
            - type: "null"
        reply_delay_seconds:
          description: Random delay range applied to automated sends. Null means none.
          type: [object, "null"]
          additionalProperties: false
          required: [min, max]
          properties:
            min:
              type: integer
              minimum: 0
              maximum: 86400
            max:
              type: integer
              minimum: 0
              maximum: 86400
        daily_send_limit:
          description: Maximum automated sends per user per local day. Null means server default.
          type: [integer, "null"]
          minimum: 0
          maximum: 1000
        approval_required_for:
          description: Situations that always go to the approval queue, even in autopilot.
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ApprovalReason"
    PreferencesUpdate:
      type: object
      additionalProperties: false
      required: [intent, style, automation]
      properties:
        intent:
          $ref: "#/components/schemas/Intent"
        dealbreakers:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 200
        style:
          $ref: "#/components/schemas/StyleProfile"
        automation:
          $ref: "#/components/schemas/AutomationSettings"
    Preferences:
      type: object
      required: [version, intent, dealbreakers, style, automation, updated_at]
      properties:
        version:
          description: Monotonic version. `0` = never saved (defaults).
          type: integer
          minimum: 0
        intent:
          $ref: "#/components/schemas/Intent"
        dealbreakers:
          type: array
          items:
            type: string
        style:
          $ref: "#/components/schemas/StyleProfile"
        automation:
          $ref: "#/components/schemas/AutomationSettings"
        updated_at:
          description: Time of this version (null only when `version` is 0).
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    PreferencesPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Preferences"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    ContactPreferenceOverrideUpdate:
      description: Every field null = inherit from user-wide preferences.
      type: object
      additionalProperties: false
      properties:
        intent:
          anyOf:
            - $ref: "#/components/schemas/Intent"
            - type: "null"
        style:
          anyOf:
            - $ref: "#/components/schemas/StyleProfile"
            - type: "null"
        automation_mode:
          anyOf:
            - $ref: "#/components/schemas/AutomationMode"
            - type: "null"
    ContactPreferences:
      type: object
      required: [contact_id, override, effective]
      properties:
        contact_id:
          $ref: "#/components/schemas/Id"
        override:
          description: The stored override (all-null when none). `version` 0 when never saved.
          type: object
          required: [version]
          properties:
            version:
              type: integer
              minimum: 0
            intent:
              anyOf:
                - $ref: "#/components/schemas/Intent"
                - type: "null"
            style:
              anyOf:
                - $ref: "#/components/schemas/StyleProfile"
                - type: "null"
            automation_mode:
              anyOf:
                - $ref: "#/components/schemas/AutomationMode"
                - type: "null"
            updated_at:
              anyOf:
                - $ref: "#/components/schemas/Timestamp"
                - type: "null"
        effective:
          $ref: "#/components/schemas/Preferences"

    # ---------------------------------------------------------------- connections
    Connection:
      type: object
      required: [id, platform, display_name, status, capabilities, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        platform:
          $ref: "#/components/schemas/Platform"
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/ConnectionStatus"
        capabilities:
          $ref: "./schemas/connector_capabilities.v1.json"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        device_install_id:
          description: |
            (1.2.0, optional.) The app installation this device-side connection is bound
            to; null for backend-side connections (`mock`). Only that install's claims
            are meaningful for this connection.
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        paired_at:
          description: (1.2.0, optional.) When `createConnection` paired it; null for connections created outside the API.
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        unpaired_at:
          description: (1.2.0, optional.) Set by `unpairConnection`; null while paired.
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        transport:
          $ref: "#/components/schemas/ConnectionTransport"
        experimental:
          description: |
            (1.3.0, optional.) True exactly for `transport: unofficial_api` (D-021). An
            experimental connection is approval-only and never swipes until
            `experimental_verified_at` is set (ADR 0008).
          type: boolean
        experimental_consent:
          description: (1.3.0, optional.) The user's recorded ban-risk consent; null for non-experimental connections.
          anyOf:
            - $ref: "#/components/schemas/ExperimentalConsent"
            - type: "null"
        experimental_verified_at:
          description: |
            (1.3.0, optional.) When an operator recorded a live test of this experimental
            connection (D-016 operator path, no API). Null = experimental-unverified.
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        auto_swipe_enabled:
          description: (1.3.0, optional.) The user's per-connection auto-swipe switch (`putConnectionSettings`). Default false.
          type: boolean
      allOf:
        - description: (1.3.0) `experimental` is true exactly for `unofficial_api`.
          if:
            required: [transport]
            properties:
              transport:
                const: unofficial_api
          then:
            required: [experimental]
            properties:
              experimental:
                const: true
          else:
            properties:
              experimental:
                const: false
        - description: (1.3.0) A paired experimental connection always carries an unrevoked consent.
          if:
            required: [experimental, unpaired_at]
            properties:
              experimental:
                const: true
              unpaired_at:
                type: "null"
          then:
            required: [experimental_consent]
            properties:
              experimental_consent:
                $ref: "#/components/schemas/ExperimentalConsent"
                properties:
                  revoked_at:
                    type: "null"
        - description: (1.3.0) Consent and verification exist only on experimental connections.
          if:
            required: [experimental]
            properties:
              experimental:
                const: false
          then:
            properties:
              experimental_verified_at:
                type: "null"
              experimental_consent:
                type: "null"
    ConnectionCreateRequest:
      description: |
        (1.2.0) Pair a connector (ADR 0007). Device-side platforms need
        `device_install_id` and the claimed `capabilities`; `mock` takes neither.
        Claimed capabilities are never stored as `VERIFIED`. (1.3.0) Dating and iMessage
        platforms, `transport`, and the experimental consent (ADR 0008). There is no
        field for platform credentials or session tokens, and there never will be.
      type: object
      additionalProperties: false
      required: [platform, display_name]
      properties:
        platform:
          description: Pairable platforms. `mock` only outside `prod`. `tinder`, `bumble`, `hinge`, `imessage` since 1.3.0.
          type: string
          enum: [sms, android_notification, mock, tinder, bumble, hinge, imessage]
        transport:
          $ref: "#/components/schemas/ConnectionTransport"
        experimental:
          description: "(1.3.0) `true` exactly with `transport: unofficial_api`."
          type: boolean
        experimental_consent:
          $ref: "#/components/schemas/ExperimentalConsentInput"
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        device_install_id:
          description: The app's per-install random UUID (the one used for `claimOutboxInstructions`).
          $ref: "#/components/schemas/Id"
        capabilities:
          description: What the connector claims on this device. A claim, not evidence.
          $ref: "./schemas/connector_capabilities.v1.json"
      allOf:
        - if:
            properties:
              platform:
                enum: [sms, android_notification, tinder, bumble, hinge, imessage]
          then:
            required: [device_install_id, capabilities]
        - if:
            properties:
              platform:
                const: mock
          then:
            properties:
              device_install_id: false
              capabilities: false
              transport:
                const: simulator
        - if:
            properties:
              platform:
                const: sms
          then:
            properties:
              transport:
                const: sms_provider
        - if:
            properties:
              platform:
                const: android_notification
          then:
            properties:
              transport:
                const: notification
        - if:
            properties:
              platform:
                const: imessage
          then:
            properties:
              transport:
                const: companion
        - if:
            properties:
              platform:
                enum: [tinder, bumble, hinge]
          then:
            required: [transport]
            properties:
              transport:
                enum: [notification, unofficial_api]
        - description: |
            (1.3.0, ADR 0008) `experimental: true` exactly with `unofficial_api`. The
            consent is checked by the server (`422 experimental_consent_required`), so
            a missing consent is not a schema error; a consent on a non-experimental
            request is.
          if:
            required: [transport]
            properties:
              transport:
                const: unofficial_api
          then:
            required: [experimental]
            properties:
              experimental:
                const: true
          else:
            properties:
              experimental:
                const: false
              experimental_consent: false
    ConnectionUnpairRequest:
      description: (1.2.0) Empty body; reserved for future options.
      type: object
      additionalProperties: false
      properties: {}
    ConnectionUnpairResult:
      type: object
      required:
        - connection
        - canceled_message_count
        - canceled_instruction_count
        - canceled_approval_count
        - in_flight_message_count
      properties:
        connection:
          $ref: "#/components/schemas/Connection"
        canceled_message_count:
          description: Queued outbound messages of this connection canceled by this action.
          type: integer
          minimum: 0
        canceled_instruction_count:
          description: Unclaimed (`pending`) outbox instructions canceled by this action.
          type: integer
          minimum: 0
        canceled_approval_count:
          description: Pending approvals for this connection's conversations canceled by this action.
          type: integer
          minimum: 0
        in_flight_message_count:
          description: Messages already leased to a device (`sending`); not recallable, their outcome is still recorded.
          type: integer
          minimum: 0
    ConnectionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    # ---------------------------------------------------------------- conversations
    NextCursor:
      description: Cursor for the next page, or null when there are no more items.
      anyOf:
        - $ref: "#/components/schemas/Cursor"
        - type: "null"
    ContactSummary:
      type: object
      required: [id, display_name]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        display_name:
          type: string
    ConversationAutomation:
      type: object
      required: [effective_mode, contact_status, global_status]
      properties:
        effective_mode:
          $ref: "#/components/schemas/AutomationMode"
        contact_status:
          $ref: "#/components/schemas/ContactAutomationStatus"
        global_status:
          $ref: "#/components/schemas/GlobalAutomationStatus"
    Conversation:
      type: object
      required:
        - id
        - contact
        - connection_id
        - platform
        - stage
        - effective_intent
        - automation
        - unread_count
        - pending_approval_count
        - last_activity_at
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Id"
        contact:
          $ref: "#/components/schemas/ContactSummary"
        connection_id:
          $ref: "#/components/schemas/Id"
        platform:
          $ref: "#/components/schemas/Platform"
        external_thread_id:
          anyOf:
            - $ref: "#/components/schemas/ExternalId"
            - type: "null"
        stage:
          $ref: "#/components/schemas/ConversationStage"
        effective_intent:
          $ref: "#/components/schemas/IntentMode"
        automation:
          $ref: "#/components/schemas/ConversationAutomation"
        unread_count:
          type: integer
          minimum: 0
        pending_approval_count:
          type: integer
          minimum: 0
        last_message_preview:
          description: Short preview of the latest message (for the inbox row only).
          type: [string, "null"]
          maxLength: 160
        last_activity_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
    ConversationAnalysis:
      description: Advisory (WING-009). Never authorizes or triggers a send.
      type: object
      required: [stage, confidence, uncertain, interest_signals, next_action, analyzed_at, source_message_ids]
      properties:
        stage:
          $ref: "#/components/schemas/ConversationStage"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        uncertain:
          description: True when confidence is below the analyzer's threshold.
          type: boolean
        interest_signals:
          type: array
          items:
            type: object
            required: [signal, polarity]
            properties:
              signal:
                type: string
              polarity:
                type: string
                enum: [positive, negative, neutral, uncertain]
              source_message_id:
                anyOf:
                  - $ref: "#/components/schemas/Id"
                  - type: "null"
        next_action:
          type: string
          enum: [reply, wait, ask_question, suggest_date, confirm_details, give_space, stop, ask_user]
        source_message_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        analyzed_at:
          $ref: "#/components/schemas/Timestamp"
    ConversationDetail:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          required: [analysis]
          properties:
            analysis:
              anyOf:
                - $ref: "#/components/schemas/ConversationAnalysis"
                - type: "null"
    ConversationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    # ---------------------------------------------------------------- messages
    MessageFailure:
      type: object
      required: [code, retryable]
      properties:
        code:
          description: Connector failure code (e.g. `capability_unsupported`, `transport_error`, `timeout`, `rejected_by_platform`).
          type: string
        detail:
          type: [string, "null"]
        retryable:
          type: boolean
    Message:
      type: object
      required: [id, conversation_id, direction, origin, text, delivery_state, attempt_count, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        conversation_id:
          $ref: "#/components/schemas/Id"
        direction:
          $ref: "#/components/schemas/MessageDirection"
        origin:
          $ref: "#/components/schemas/MessageOrigin"
        text:
          type: string
        delivery_state:
          $ref: "#/components/schemas/DeliveryState"
        external_message_id:
          description: Platform ID. Inbound always set; outbound set once the connector acknowledges.
          anyOf:
            - $ref: "#/components/schemas/ExternalId"
            - type: "null"
        approval_id:
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        attempt_count:
          type: integer
          minimum: 0
        failure:
          anyOf:
            - $ref: "#/components/schemas/MessageFailure"
            - type: "null"
        created_at:
          description: Inbound -> when the platform says it was sent; outbound -> when queued.
          $ref: "#/components/schemas/Timestamp"
        sent_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        delivered_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      allOf:
        - if:
            properties:
              direction:
                const: inbound
          then:
            properties:
              origin:
                const: contact
              delivery_state:
                const: received
          else:
            properties:
              origin:
                enum: [user_manual, approved_draft, autopilot, assisted_draft]
              delivery_state:
                enum: [queued, sending, sent, delivered, failed, dead_lettered, canceled, user_reported_sent]
        - if:
            properties:
              delivery_state:
                enum: [queued, sending, canceled, user_reported_sent]
          then:
            properties:
              sent_at:
                type: "null"
              delivered_at:
                type: "null"
        - if:
            properties:
              delivery_state:
                const: delivered
          then:
            required: [sent_at, delivered_at]
            properties:
              sent_at:
                $ref: "#/components/schemas/Timestamp"
              delivered_at:
                $ref: "#/components/schemas/Timestamp"
        - description: (1.3.0) `assisted_draft` messages are exactly the `user_reported_sent` ones.
          if:
            required: [origin]
            properties:
              origin:
                const: assisted_draft
          then:
            properties:
              delivery_state:
                const: user_reported_sent
          else:
            properties:
              delivery_state:
                not:
                  const: user_reported_sent
    MessagePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    SendMessageRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000

    # ---------------------------------------------------------------- drafts
    DraftCreateRequest:
      type: object
      additionalProperties: false
      properties:
        guidance:
          description: Optional user hint for this draft ("ask about her trip").
          type: [string, "null"]
          maxLength: 500
    Draft:
      description: An LLM suggestion. Not an authorization to send.
      type: object
      required:
        - id
        - conversation_id
        - decision
        - text
        - rationale
        - confidence
        - requires_approval
        - approval_reasons
        - intent_mode
        - grounding
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Id"
        conversation_id:
          $ref: "#/components/schemas/Id"
        decision:
          $ref: "#/components/schemas/DraftDecision"
        text:
          description: Suggested reply. Null unless `decision` is `send_candidate`.
          type: [string, "null"]
          maxLength: 4000
        question_for_user:
          description: Set when `decision` is `ask_user`.
          type: [string, "null"]
        rationale:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        requires_approval:
          type: boolean
        approval_reasons:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalReason"
        intent_mode:
          $ref: "#/components/schemas/IntentMode"
        grounding:
          description: The memory facts and messages this draft relied on (attribution, WING-008).
          type: object
          required: [memory_ids, message_ids]
          properties:
            memory_ids:
              type: array
              items:
                $ref: "#/components/schemas/Id"
            message_ids:
              type: array
              items:
                $ref: "#/components/schemas/Id"
        created_at:
          $ref: "#/components/schemas/Timestamp"
      if:
        properties:
          decision:
            const: send_candidate
      then:
        properties:
          text:
            type: string
            minLength: 1
      else:
        properties:
          text:
            type: "null"

    # ---------------------------------------------------------------- approvals
    Approval:
      type: object
      required: [id, conversation_id, contact_id, status, draft, reasons, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        conversation_id:
          $ref: "#/components/schemas/Id"
        contact_id:
          $ref: "#/components/schemas/Id"
        status:
          $ref: "#/components/schemas/ApprovalStatus"
        draft:
          $ref: "#/components/schemas/Draft"
        reasons:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ApprovalReason"
        final_text:
          description: Text actually queued (draft text or the user's edit). Set when approved.
          type: [string, "null"]
        rejection_reason:
          type: [string, "null"]
        message_id:
          description: Outbound message created on approval.
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        decided_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    ApprovalPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    ApproveRequest:
      type: object
      additionalProperties: false
      properties:
        edited_text:
          description: Replaces the draft text. Null/absent sends the draft as-is.
          type: [string, "null"]
          minLength: 1
          maxLength: 4000
    RejectRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: [string, "null"]
          maxLength: 500
    ApprovalDecisionResult:
      type: object
      required: [approval, message]
      properties:
        approval:
          $ref: "#/components/schemas/Approval"
        message:
          description: The queued outbound message (approve) or null (reject).
          anyOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"

    # ---------------------------------------------------------------- automation
    AutomationActionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: [string, "null"]
          maxLength: 500
    GlobalAutomationState:
      description: |
        Global pause stops every automated send for the user immediately: queued
        automated messages become `canceled`; drafts may still be queued for approval.
      type: object
      required: [status, changed_at]
      properties:
        status:
          $ref: "#/components/schemas/GlobalAutomationStatus"
        changed_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    ContactAutomationState:
      type: object
      required: [contact_id, status, effective_mode, global_status, changed_at, canceled_approval_count, canceled_message_count]
      properties:
        contact_id:
          $ref: "#/components/schemas/Id"
        status:
          $ref: "#/components/schemas/ContactAutomationStatus"
        effective_mode:
          $ref: "#/components/schemas/AutomationMode"
        global_status:
          $ref: "#/components/schemas/GlobalAutomationStatus"
        changed_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        canceled_approval_count:
          description: Approvals canceled by this action (takeover); 0 otherwise.
          type: integer
          minimum: 0
        canceled_message_count:
          description: Queued automated messages canceled by this action.
          type: integer
          minimum: 0

    # ---------------------------------------------------------------- audit
    AgentAction:
      type: object
      required: [id, type, actor, occurred_at, details]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          $ref: "#/components/schemas/AgentActionType"
        actor:
          $ref: "#/components/schemas/Actor"
        conversation_id:
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        contact_id:
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        message_id:
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        approval_id:
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        reason_code:
          description: Machine-readable reason (an `ErrorCode`, `ApprovalReason`, or connector failure code).
          type: [string, "null"]
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
        details:
          description: Redacted structured metadata. Never message text, tokens, or phone numbers.
          type: object
    AgentActionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentAction"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    # ---------------------------------------------------------------- device ingest (1.1.0)
    ConnectorEventIngestOutcome:
      description: |
        `accepted`: first time this event was seen; recorded (HTTP 202).
        `duplicate_event`: this `event_id` was already ingested; nothing changed (HTTP 200).
        `duplicate_message`: an inbound message with the same
        `(user_id, platform, external_message_id)` is already stored under another
        `event_id`; nothing changed (HTTP 200).
      type: string
      enum: [accepted, duplicate_event, duplicate_message]
    ConnectorEventIngestResult:
      type: object
      required: [event_id, outcome, message_id, recorded_at]
      properties:
        event_id:
          $ref: "#/components/schemas/Id"
        outcome:
          $ref: "#/components/schemas/ConnectorEventIngestOutcome"
        message_id:
          description: |
            Wingman message the event concerns: the stored inbound message, or the
            outbound message a send outcome refers to. Null for connection events.
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        notice_id:
          description: |
            (1.3.0, optional.) The `InboundNotice` an inbound event was stored as when it
            does not enter the pipeline (then `message_id` is null). Null otherwise.
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        recorded_at:
          description: When the server first recorded this event (for duplicates, the original time).
          $ref: "#/components/schemas/Timestamp"

    # ---------------------------------------------------------------- device outbox (1.1.0)
    OutboxInstructionState:
      description: |
        `pending`: created by the dispatcher, not yet claimed (message `queued`).
        `leased`: claimed by one device install until `lease_expires_at` (message
        `sending`). `completed`: an outcome event (acknowledged or failed) was
        ingested. `expired`: the lease lapsed with no outcome; the outcome is unknown
        and the instruction is never re-leased or retried automatically (a late
        outcome event still moves it to `completed`). `canceled`: removed before any
        lease (pause, takeover, capability change); never sent. `completed` and
        `canceled` are terminal.
      type: string
      enum: [pending, leased, completed, expired, canceled]
    OutboxAuthorization:
      description: |
        Why the dispatcher authorized this send, for the device's local audit
        (WING-016 `SmsSendCommand.authorizedBy`). Informational: the device cannot
        widen or change it.
      type: object
      required: [origin, approval_id]
      properties:
        origin:
          description: The outbound `MessageOrigin` of the message.
          type: string
          enum: [user_manual, approved_draft, autopilot]
        approval_id:
          description: Set exactly when `origin` is `approved_draft`.
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
      if:
        properties:
          origin:
            const: approved_draft
      then:
        properties:
          approval_id:
            $ref: "#/components/schemas/Id"
      else:
        properties:
          approval_id:
            type: "null"
    OutboxInstructionSummary:
      description: |
        Listing view of a send instruction. Carries no message text and no
        destination, so it cannot be executed.
      type: object
      required:
        - id
        - connection_id
        - outbound_message_id
        - idempotency_key
        - attempt
        - state
        - created_at
        - leased_at
        - lease_expires_at
      properties:
        id:
          $ref: "#/components/schemas/Id"
        connection_id:
          $ref: "#/components/schemas/Id"
        outbound_message_id:
          description: The Wingman outbound `Message.id` this instruction sends.
          $ref: "#/components/schemas/Id"
        idempotency_key:
          description: |
            Per-attempt connector send key (D-006), e.g. `send:<message_id>:<attempt>`.
            Unique per instruction. The device performs at most one transport attempt
            per key and echoes it in `send_acknowledged` / `send_failed` events.
          $ref: "#/components/schemas/IdempotencyKey"
        attempt:
          description: 1 for the first attempt; each retry is a new instruction with attempt + 1 and a new key.
          type: integer
          minimum: 1
        state:
          $ref: "#/components/schemas/OutboxInstructionState"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        leased_at:
          description: Null until claimed.
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        lease_expires_at:
          description: Null until claimed. No transport attempt may start at or after this instant.
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      if:
        properties:
          state:
            enum: [pending, canceled]
      then:
        properties:
          leased_at:
            type: "null"
          lease_expires_at:
            type: "null"
      else:
        properties:
          leased_at:
            $ref: "#/components/schemas/Timestamp"
          lease_expires_at:
            $ref: "#/components/schemas/Timestamp"
    OutboxInstruction:
      description: |
        A leased send instruction: everything the device needs to perform exactly one
        transport attempt. Returned only by `claimOutboxInstructions`, only to the
        lease holder, and always in state `leased`. The same fields as
        `OutboxInstructionSummary` plus the payload. `text` and `external_thread_id`
        are private: never log them.
      type: object
      required:
        - id
        - connection_id
        - outbound_message_id
        - idempotency_key
        - attempt
        - state
        - created_at
        - leased_at
        - lease_expires_at
        - conversation_id
        - external_thread_id
        - text
        - authorization
      properties:
        id:
          $ref: "#/components/schemas/Id"
        connection_id:
          $ref: "#/components/schemas/Id"
        outbound_message_id:
          description: The Wingman outbound `Message.id` this instruction sends.
          $ref: "#/components/schemas/Id"
        idempotency_key:
          description: |
            Per-attempt connector send key (D-006), e.g. `send:<message_id>:<attempt>`.
            Unique per instruction. The device performs at most one transport attempt
            per key and echoes it in `send_acknowledged` / `send_failed` events.
          $ref: "#/components/schemas/IdempotencyKey"
        attempt:
          description: 1 for the first attempt; each retry is a new instruction with attempt + 1 and a new key.
          type: integer
          minimum: 1
        state:
          const: leased
        created_at:
          $ref: "#/components/schemas/Timestamp"
        leased_at:
          $ref: "#/components/schemas/Timestamp"
        lease_expires_at:
          description: No transport attempt may start at or after this instant (see `OutboxClaimResult.server_time`).
          $ref: "#/components/schemas/Timestamp"
        conversation_id:
          $ref: "#/components/schemas/Id"
        external_thread_id:
          description: Platform thread to send into (the destination). For SMS, `sms:<normalized address>`.
          $ref: "#/components/schemas/ExternalId"
        text:
          description: Exact text the dispatcher authorized. The device sends it unchanged.
          type: string
          minLength: 1
          maxLength: 4000
        authorization:
          $ref: "#/components/schemas/OutboxAuthorization"
    OutboxInstructionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OutboxInstructionSummary"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    OutboxClaimRequest:
      type: object
      additionalProperties: false
      required: [device_install_id]
      properties:
        device_install_id:
          description: |
            Random UUID the app generates once per installation and keeps in private
            storage. Identifies the lease holder; a reinstall is a new holder.
          $ref: "#/components/schemas/Id"
        max_instructions:
          description: |
            Upper bound on instructions in this response, counting both newly leased
            ones and still-valid leases this install already holds.
          type: integer
          minimum: 1
          maximum: 20
          default: 1
    OutboxClaimResult:
      type: object
      required: [instructions, server_time]
      properties:
        instructions:
          description: Leased to the caller, oldest first. Empty when there is nothing to send.
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/OutboxInstruction"
        server_time:
          description: Server clock at lease time, so the device can compute its local deadline despite clock skew.
          $ref: "#/components/schemas/Timestamp"

    # ---------------------------------------------------------------- memories (1.1.0)
    MemoryKind:
      type: string
      enum: [fact, summary]
    MemoryBasis:
      description: |
        `stated`: the contact said it explicitly in a cited message (or the user
        corrected it). `inferred`: the model's reading; must be shown as unconfirmed.
      type: string
      enum: [stated, inferred]
    MemoryOrigin:
      type: string
      enum: [extracted, user_correction]
    Memory:
      description: |
        One remembered fact or rolling summary about a contact, attributed to the
        messages it came from. Advisory context only. `content` is private: never log.
        A memory is active when `superseded_by_id` is null and `expires_at` is null or
        in the future.
      type: object
      required:
        - id
        - contact_id
        - conversation_id
        - kind
        - key
        - category
        - content
        - basis
        - origin
        - confidence
        - sensitive
        - source_message_ids
        - stated_at
        - expires_at
        - superseded_by_id
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Id"
        contact_id:
          $ref: "#/components/schemas/Id"
        conversation_id:
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        kind:
          $ref: "#/components/schemas/MemoryKind"
        key:
          description: Slot such as `work.job_title`; facts with the same key supersede each other. Null for summaries and unkeyed facts.
          type: [string, "null"]
          minLength: 1
          maxLength: 64
        category:
          description: |
            Fact category; null for summaries. Known values (WING-008 `FactCategory`):
            `identity`, `work`, `education`, `location`, `family`, `pets`, `interests`,
            `preferences`, `plans`, `availability`, `relationship`, `communication`,
            `other`, and the sensitive `health`, `sexuality`, `religion`, `politics`,
            `ethnicity`, `finances`. Open string: new categories may appear, and
            clients must display unknown values rather than fail.
          type: [string, "null"]
          minLength: 1
          maxLength: 64
        content:
          type: string
          minLength: 1
          maxLength: 2000
        basis:
          $ref: "#/components/schemas/MemoryBasis"
        origin:
          $ref: "#/components/schemas/MemoryOrigin"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        sensitive:
          description: True when the category or the key's first segment is a sensitive category.
          type: boolean
        source_message_ids:
          description: Messages this memory is attributed to. At least one for a fact.
          type: array
          items:
            $ref: "#/components/schemas/Id"
        stated_at:
          description: When the latest cited message was sent (or when the user corrected it).
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        expires_at:
          description: End of validity for time-bound facts (plans, availability). Null means no expiry.
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        superseded_by_id:
          description: The memory that replaced this one. Null when active (or expired but not replaced).
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
      allOf:
        - if:
            properties:
              kind:
                const: summary
          then:
            properties:
              key:
                type: "null"
              category:
                type: "null"
              basis:
                const: stated
              origin:
                const: extracted
          else:
            properties:
              source_message_ids:
                minItems: 1
        - if:
            properties:
              origin:
                const: user_correction
          then:
            properties:
              kind:
                const: fact
              basis:
                const: stated
              confidence:
                const: 1
        - if:
            properties:
              basis:
                const: inferred
          then:
            description: Inferred sensitive facts are never stored (WING-008).
            properties:
              sensitive:
                const: false
    MemoryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Memory"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    MemoryCorrection:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          description: The corrected fact, in the user's words. Blank after trimming is rejected.
          type: string
          minLength: 1
          maxLength: 500

    # ---------------------------------------------------------------- dates (shape only)
    DateProposal:
      description: |
        Shared shape for WING-003 storage and WING-018. Endpoints for date proposals
        are not part of v1.0.0 and will be added by an additive contract PR.
      type: object
      required: [id, conversation_id, state, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        conversation_id:
          $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/DateProposalState"
        proposed_start:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        proposed_end:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        venue_text:
          type: [string, "null"]
          maxLength: 300
        confirmation_message_ids:
          description: Messages carrying explicit confirmation from both sides. Required non-empty when `confirmed`.
          type: array
          items:
            $ref: "#/components/schemas/Id"
        calendar_event_id:
          description: Set only after an authorized calendar write (`calendar_write` capability).
          anyOf:
            - $ref: "#/components/schemas/ExternalId"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
      if:
        properties:
          state:
            const: confirmed
      then:
        required: [confirmation_message_ids, proposed_start]
        properties:
          confirmation_message_ids:
            minItems: 1
          proposed_start:
            $ref: "#/components/schemas/Timestamp"

    # ---------------------------------------------------------------- platform integrations (1.3.0, ADR 0008)
    ConnectionTransport:
      description: |
        (1.3.0) How the paired device reaches the platform. `simulator`: the WING-006
        mock (backend-side). `sms_provider`: Android's SMS provider and `SmsManager`
        (WING-016). `notification`: the Android notification listener, with a
        RemoteInput reply only where tested (WING-017, WING-027 to 029). `companion`: a
        user-run Mac companion (iMessage, WING-030). `unofficial_api`: a device-side
        client of a platform's private API (D-021); always `experimental`. Clients must
        tolerate values added in later minor versions.
      type: string
      enum: [simulator, sms_provider, notification, companion, unofficial_api]
    ExperimentalConsentInput:
      description: |
        (1.3.0, ADR 0008) The user's explicit opt-in to an experimental (unofficial
        API) connector, given on the device after the plain-language warning that it
        uses an unofficial interface, may break the platform's terms and can get the
        account restricted or banned. One consent per platform and pairing.
      type: object
      additionalProperties: false
      required: [platform, consent_text_version, accepted_at, ban_risk_acknowledged]
      properties:
        platform:
          description: Must equal the request's `platform`.
          type: string
          enum: [tinder, bumble, hinge]
        consent_text_version:
          description: Version of the warning text the user saw, e.g. `d021-v1`.
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,31}$"
        accepted_at:
          description: When the user accepted, on the device.
          $ref: "#/components/schemas/Timestamp"
        ban_risk_acknowledged:
          description: The user ticked the ban-risk acknowledgement. Must be `true`.
          const: true
    ExperimentalConsent:
      description: (1.3.0) A recorded experimental consent, as stored by the server.
      type: object
      required: [platform, consent_text_version, accepted_at, recorded_at, revoked_at]
      properties:
        platform:
          $ref: "#/components/schemas/Platform"
        consent_text_version:
          type: string
        accepted_at:
          $ref: "#/components/schemas/Timestamp"
        recorded_at:
          description: When the server recorded the consent (pairing time).
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          description: Set by `revokeExperimentalConsent` or `unpairConnection`; null while in force.
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    ConnectionSettingsUpdate:
      description: (1.3.0) User-controlled per-connection settings. No credentials, ever.
      type: object
      additionalProperties: false
      required: [auto_swipe_enabled]
      properties:
        auto_swipe_enabled:
          type: boolean
    MarkReadRequest:
      description: (1.3.0) Empty body; reserved for future options.
      type: object
      additionalProperties: false
      properties: {}

    InboundEventKind:
      description: |
        (1.3.0) What an inbound platform event is. Only `chat_message` can ever enter
        the automation pipeline. `match` (a new match), `like_comment` (a like or a
        comment on a profile, e.g. a Hinge prompt comment, before any chat exists),
        `expiry` (a match or chat about to expire), `system` (any other platform
        notice), `unknown` (not recognized). Clients must tolerate values added later.
      type: string
      enum: [chat_message, match, like_comment, expiry, system, unknown]
    SenderIdentity:
      description: |
        (1.3.0) How sure the device is about who sent an event. `linked`: a stable
        platform identifier ties it to exactly one contact or thread. `unlinked`: only
        a display label is known. `ambiguous`: the label matches more than one person
        or thread (e.g. two matches with the same first name). Only `linked` events can
        become messages; Wingman never merges people by name.
      type: string
      enum: [linked, unlinked, ambiguous]
    InboundNotice:
      description: |
        (1.3.0) An inbound event stored for display that never enters the automation
        pipeline (ADR 0008): not a `chat_message`, not `linked`, or truncated or hidden
        content. Never drafted, approved, replied to or merged into a contact.
        `text` and `sender_label` are private: never log them.
      type: object
      required:
        - id
        - connection_id
        - platform
        - kind
        - identity
        - sender_label
        - text
        - truncated
        - content_hidden
        - external_message_id
        - external_conversation_id
        - source
        - occurred_at
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Id"
        connection_id:
          $ref: "#/components/schemas/Id"
        platform:
          $ref: "#/components/schemas/Platform"
        kind:
          $ref: "#/components/schemas/InboundEventKind"
        identity:
          $ref: "#/components/schemas/SenderIdentity"
        sender_label:
          type: [string, "null"]
          maxLength: 200
        text:
          description: As observed (possibly partial); empty when `content_hidden`.
          type: string
          maxLength: 20000
        truncated:
          type: boolean
        content_hidden:
          type: boolean
        external_message_id:
          $ref: "#/components/schemas/ExternalId"
        external_conversation_id:
          anyOf:
            - $ref: "#/components/schemas/ExternalId"
            - type: "null"
        source:
          anyOf:
            - $ref: "#/components/schemas/ConnectionTransport"
            - type: "null"
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
    InboundNoticePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InboundNotice"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    AssistedDeliveryStatus:
      description: |
        (1.3.0) `pending`: shown to the user, waiting. `user_reported_sent`: the user
        said they sent it by hand (`confirmAssistedDelivery`); Wingman did not transmit
        it and does not know whether it arrived. `dismissed`: the user will not send
        it. `canceled`: superseded by a newer inbound message, or canceled by takeover
        or unpair. All but `pending` are terminal.
      type: string
      enum: [pending, user_reported_sent, dismissed, canceled]
    AssistedDelivery:
      description: |
        (1.3.0, ADR 0008) A draft-only delivery instruction. Created **only by the
        dispatcher**, when the policy would hand a draft to a connection that cannot
        send (`send: UNSUPPORTED`) on a platform with an assisted path (`tinder`,
        `bumble`, `hinge`, `imessage`). The app or device shows `text`, copies it or
        opens the platform app at `external_thread_id`, and never transmits it. `text`
        is private: never log.
      type: object
      required:
        - id
        - conversation_id
        - contact_id
        - connection_id
        - platform
        - external_thread_id
        - draft_id
        - text
        - reasons
        - status
        - final_text
        - message_id
        - cancel_reason
        - created_at
        - decided_at
      properties:
        id:
          $ref: "#/components/schemas/Id"
        conversation_id:
          $ref: "#/components/schemas/Id"
        contact_id:
          $ref: "#/components/schemas/Id"
        connection_id:
          $ref: "#/components/schemas/Id"
        platform:
          $ref: "#/components/schemas/Platform"
        external_thread_id:
          description: Platform thread to open, when known.
          anyOf:
            - $ref: "#/components/schemas/ExternalId"
            - type: "null"
        draft_id:
          $ref: "#/components/schemas/Id"
        text:
          description: The suggested reply.
          type: string
          minLength: 1
          maxLength: 4000
        reasons:
          description: Content reasons the user should review before sending (may be empty).
          type: array
          items:
            $ref: "#/components/schemas/ApprovalReason"
        status:
          $ref: "#/components/schemas/AssistedDeliveryStatus"
        final_text:
          description: What the user reported sending (the draft or their edit). Set when `user_reported_sent`.
          type: [string, "null"]
          maxLength: 4000
        message_id:
          description: The `assisted_draft` message recorded on confirmation.
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        cancel_reason:
          description: Set when `canceled` (`superseded`, `automation_takeover`, `connection_unavailable`).
          type: [string, "null"]
        created_at:
          $ref: "#/components/schemas/Timestamp"
        decided_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      allOf:
        - if:
            properties:
              status:
                const: pending
          then:
            properties:
              decided_at:
                type: "null"
              final_text:
                type: "null"
              message_id:
                type: "null"
          else:
            properties:
              decided_at:
                $ref: "#/components/schemas/Timestamp"
        - if:
            properties:
              status:
                const: user_reported_sent
          then:
            properties:
              final_text:
                type: string
                minLength: 1
              message_id:
                $ref: "#/components/schemas/Id"
          else:
            properties:
              message_id:
                type: "null"
    AssistedDeliveryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssistedDelivery"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    AssistedDeliveryConfirmRequest:
      type: object
      additionalProperties: false
      properties:
        sent_text:
          description: What the user actually sent, if they edited the draft. Null/absent = the draft text.
          type: [string, "null"]
          minLength: 1
          maxLength: 4000
    AssistedDeliveryResult:
      type: object
      required: [assisted_delivery, message]
      properties:
        assisted_delivery:
          $ref: "#/components/schemas/AssistedDelivery"
        message:
          description: The `assisted_draft` message (`user_reported_sent`) on confirm; null on dismiss.
          anyOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"

    IdentityLinkCreateRequest:
      type: object
      additionalProperties: false
      required: [contact_id, linked_contact_id]
      properties:
        contact_id:
          $ref: "#/components/schemas/Id"
        linked_contact_id:
          $ref: "#/components/schemas/Id"
    IdentityLink:
      description: |
        (1.3.0) The user said these two contacts are the same person. Unordered:
        `contact_ids` is sorted. Only ever made by the user (`origin: user`).
      type: object
      required: [id, contact_ids, origin, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        contact_ids:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Id"
        origin:
          const: user
        created_at:
          $ref: "#/components/schemas/Timestamp"
    IdentityLinkPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IdentityLink"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"

    ProfileProvider:
      description: (1.3.0) Dating platform a profile comes from. `mock` only for fixtures.
      type: string
      enum: [tinder, bumble, hinge, mock]
    ProfileSource:
      description: |
        (1.3.0) How the profile reached Wingman. `manual`: the user shared it.
        `fixture`: deterministic test or demo data. `device`: read by a device-side
        connector with `profile_read` (WING-031 onward).
      type: string
      enum: [manual, fixture, device]
    ProfilePrompt:
      type: object
      additionalProperties: false
      required: [prompt, answer]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 300
        answer:
          type: string
          maxLength: 1000
    ProfileAttributes:
      description: |
        Only attributes the source actually provided, under the source's own names
        (e.g. `age`, `height_cm`, `location_label`, `interests`). Absent means unknown,
        never inferred (not from photos, names or model output).
      type: object
      maxProperties: 50
      propertyNames:
        pattern: "^[a-z][a-z0-9_]{0,63}$"
      additionalProperties:
        anyOf:
          - type: string
            maxLength: 500
          - type: number
          - type: boolean
          - type: array
            maxItems: 50
            items:
              type: string
              maxLength: 200
    ProfileImportRequest:
      type: object
      additionalProperties: false
      required: [provider, external_profile_id, source, source_observed_at]
      properties:
        provider:
          $ref: "#/components/schemas/ProfileProvider"
        external_profile_id:
          $ref: "#/components/schemas/ExternalId"
        source:
          $ref: "#/components/schemas/ProfileSource"
        connection_id:
          description: "Required for `source: device`; optional otherwise."
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        display_name:
          type: [string, "null"]
          maxLength: 120
        bio:
          type: [string, "null"]
          maxLength: 5000
        prompts:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProfilePrompt"
        attributes:
          $ref: "#/components/schemas/ProfileAttributes"
        source_observed_at:
          description: When the source showed this profile content.
          $ref: "#/components/schemas/Timestamp"
      allOf:
        - if:
            properties:
              source:
                const: device
          then:
            required: [connection_id]
            properties:
              connection_id:
                $ref: "#/components/schemas/Id"
        - if:
            properties:
              provider:
                const: mock
          then:
            properties:
              source:
                const: fixture
    EvaluationReason:
      type: object
      required: [factor, effect, detail]
      properties:
        factor:
          description: What was compared, e.g. `intent`, `dealbreaker`, `interests`.
          type: string
          maxLength: 64
        effect:
          type: string
          enum: [positive, negative, neutral]
        detail:
          type: string
          maxLength: 500
        evidence:
          description: Profile fields the reason is based on (e.g. `bio`, `prompts/0`, `attributes/age`).
          type: array
          items:
            type: string
            maxLength: 128
    Evaluation:
      description: |
        (1.3.0, WING-019) Advisory compatibility assessment. Never authorizes a swipe.
        `known_unknowns` lists what the profile did not say that would matter.
      type: object
      required: [id, profile_id, score, reasons, known_unknowns, intent_mode, confidence, evaluator_version, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        profile_id:
          $ref: "#/components/schemas/Id"
        score:
          description: 0 to 100, or null when there is too little information to score.
          type: [number, "null"]
          minimum: 0
          maximum: 100
        reasons:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationReason"
        known_unknowns:
          type: array
          items:
            type: string
            maxLength: 200
        intent_mode:
          description: The user's intent the evaluation used (later preference changes do not rewrite it).
          $ref: "#/components/schemas/IntentMode"
        dealbreakers_hit:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evaluator_version:
          type: string
          maxLength: 64
        created_at:
          $ref: "#/components/schemas/Timestamp"
    ProfileDecision:
      description: (1.3.0) The user's decision. `skip` = decide later; it is never executed.
      type: string
      enum: [like, pass, skip, superlike]
    ProfileActionExecution:
      description: |
        (1.3.0) Platform execution status, separate from the user's decision.
        `not_executable`: recorded only (default, and always for `skip`). `queued`:
        passed the execution gate, not executed yet. `executed`: a device reported the
        platform accepted it. `failed`: a device reported a definitive failure.
        `unknown`: execution was attempted but no outcome was observed (never treated
        as executed, never retried automatically).
      type: string
      enum: [not_executable, queued, executed, failed, unknown]
    ProfileAction:
      type: object
      required:
        - id
        - profile_id
        - connection_id
        - decision
        - idempotency_key
        - execution
        - execution_detail
        - decided_at
        - execution_requested_at
        - executed_at
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/Id"
        profile_id:
          $ref: "#/components/schemas/Id"
        connection_id:
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        decision:
          $ref: "#/components/schemas/ProfileDecision"
        idempotency_key:
          $ref: "#/components/schemas/IdempotencyKey"
        execution:
          $ref: "#/components/schemas/ProfileActionExecution"
        execution_detail:
          description: Failure or unknown-outcome code; never platform response bodies.
          type: [string, "null"]
          maxLength: 200
        decided_at:
          $ref: "#/components/schemas/Timestamp"
        execution_requested_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        executed_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
      allOf:
        - if:
            properties:
              decision:
                const: skip
          then:
            properties:
              execution:
                const: not_executable
        - if:
            properties:
              execution:
                const: executed
          then:
            properties:
              executed_at:
                $ref: "#/components/schemas/Timestamp"
          else:
            properties:
              executed_at:
                type: "null"
        - if:
            properties:
              execution:
                const: not_executable
          then:
            properties:
              execution_requested_at:
                type: "null"
          else:
            properties:
              connection_id:
                $ref: "#/components/schemas/Id"
              execution_requested_at:
                $ref: "#/components/schemas/Timestamp"
    Profile:
      description: |
        (1.3.0, WING-019/031) A normalized dating profile. Only provided content; no
        inferred attributes. `bio`, `prompts` and `attributes` are private: never log.
      type: object
      required:
        - id
        - provider
        - external_profile_id
        - display_name
        - bio
        - prompts
        - attributes
        - source_observed_at
        - provenance
        - stale
        - latest_evaluation
        - latest_action
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Id"
        provider:
          $ref: "#/components/schemas/ProfileProvider"
        external_profile_id:
          $ref: "#/components/schemas/ExternalId"
        display_name:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/ProfilePrompt"
        attributes:
          $ref: "#/components/schemas/ProfileAttributes"
        source_observed_at:
          $ref: "#/components/schemas/Timestamp"
        provenance:
          type: object
          required: [source, connection_id, imported_at]
          properties:
            source:
              $ref: "#/components/schemas/ProfileSource"
            connection_id:
              anyOf:
                - $ref: "#/components/schemas/Id"
                - type: "null"
            imported_at:
              $ref: "#/components/schemas/Timestamp"
        stale:
          description: |
            True when the content may no longer match the platform (older than the
            server's freshness window, 14 days in 1.3.0, or invalidated by the
            source). A stale profile can be decided on but never executed.
          type: boolean
        latest_evaluation:
          anyOf:
            - $ref: "#/components/schemas/Evaluation"
            - type: "null"
        latest_action:
          anyOf:
            - $ref: "#/components/schemas/ProfileAction"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    ProfilePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    ProfileDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/ProfileDecision"
        connection_id:
          description: The connection a later execution would use (same platform as the profile).
          anyOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
