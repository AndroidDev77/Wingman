    get:
      tags: [connections]
      operationId: listOutboxInstructions
      summary: Read-only view of the connection's send instructions (no message text)
      description: |
        Lists the send instructions the dispatcher created for this connection,
        oldest first (`created_at` ascending, then `id`). For reconciliation and
        diagnostics only: items are `OutboxInstructionSummary` and carry **no text and
        no destination**, so nothing here can be sent. Listing never leases, never
        changes state, and is not an authorization. To obtain an instruction to
        execute, a device must claim it (`claimOutboxInstructions`). See ADR 0006.
        Defaults to `state=pending` when no state is given.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          required: false
