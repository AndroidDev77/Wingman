# Wingman CI (WING-023). Every job calls the same script a developer runs locally.
#   backend     scripts/backend-check.sh against a Postgres 16 service
#   migrations  scripts/migration-check.sh (upgrade head -> downgrade base -> upgrade head)
#   contracts   contracts/validate.sh (OpenAPI, JSON Schemas, examples)
#   docker      builds backend/Dockerfile and smoke-tests the image's /health
#   android     scripts/android-build.sh (debug APK + JVM unit tests)
# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wingman
          POSTGRES_PASSWORD: wingman # CI-only throwaway credential
          POSTGRES_DB: wingman
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wingman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The tests create and drop wingman_test_* scratch databases (role needs CREATEDB;
      # the POSTGRES_USER superuser has it).
      WINGMAN_TEST_DATABASE_URL: postgresql+asyncpg://wingman:wingman@localhost:5432/wingman
      WINGMAN_ENV: test
      WINGMAN_LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Lint, format check, typecheck, tests
        run: scripts/backend-check.sh

  migrations:
    name: Migrations (up, down, up)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wingman
          POSTGRES_PASSWORD: wingman # CI-only throwaway credential
          POSTGRES_DB: wingman
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wingman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # A fresh, empty database: proves the app's schema can be created from nothing.
      WINGMAN_DATABASE_URL: postgresql+asyncpg://wingman:wingman@localhost:5432/wingman
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: alembic upgrade head, downgrade base, upgrade head
        run: scripts/migration-check.sh

  contracts:
    name: Contracts (OpenAPI + JSON Schema)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: contracts/validate.py
      - name: Validate contracts
        run: contracts/validate.sh

  docker:
    name: Backend image (build + /health smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build image and smoke-test /health
        env:
          DOCKER_PULL: "1"
        run: scripts/docker-smoke.sh wingman-backend:ci

  android:
    name: Android (assembleDebug + unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      # Installs/locates the SDK and exports ANDROID_HOME; AGP downloads platform 35 and
      # build-tools on demand because the licenses are accepted here.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platforms;android-35 build-tools;35.0.0 platform-tools"
      # Caches ~/.gradle and validates the wrapper JAR checksum.
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build debug APK and run JVM unit tests
        run: scripts/android-build.sh
      - name: Upload unit test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
