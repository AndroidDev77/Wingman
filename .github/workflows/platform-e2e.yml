# WING-032 cross-platform acceptance. Two jobs, each calling scripts a developer runs locally:
#   platform-e2e   scripts/e2e/platforms/run.sh: the real backend (API + worker, dev auth stub,
#                  labeled dev mock LLM + "[e2e scripted]" date answers), real Postgres 16, driven
#                  over HTTP by simulators of every connector (SMS, Tinder/Bumble/Hinge notifications,
#                  Hinge experimental, iMessage companion, discovery). MOCK ONLY: a pass here is
#                  "PASSED WITH MOCK" and never changes a capability label or a device status
#                  (docs/integrations/cross_platform_test_matrix.md).
#   release-gates  scripts/release/check_feature_gates.py (no feature autonomous without VERIFIED
#                  device evidence), the release script tests, and the manual-run tool self-tests.
# No skips, continue-on-error or retries (D-018). Third-party actions pinned to full commit SHAs.
name: Platform E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12"

jobs:
  platform-e2e:
    name: Platform E2E (mock connectors)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wingman
          POSTGRES_PASSWORD: wingman # CI-only throwaway credential
          POSTGRES_DB: wingman_platforms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wingman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # An EMPTY database: run.sh migrates it with `alembic upgrade head`.
      WINGMAN_E2E_DATABASE_URL: postgresql+asyncpg://wingman:wingman@localhost:5432/wingman_platforms
      WINGMAN_E2E_ARTIFACTS: ${{ github.workspace }}/platform-artifacts
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: scripts/e2e/platforms/run.sh
        run: scripts/e2e/platforms/run.sh
      - name: Upload artifacts (server log, junit, invariants, scenario results, gate cross-check)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: platform-e2e
          path: platform-artifacts/
          if-no-files-found: warn
          retention-days: 14

  release-gates:
    name: Release feature gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Feature gates (no autonomous feature without VERIFIED device evidence)
        run: python3 scripts/release/check_feature_gates.py --summary
      - name: Release script tests (check.sh, build.sh, version.sh, feature gates)
        run: python3 -m unittest discover -s tests/release -v
      - name: Manual-run tool self-tests (redaction, backend evidence)
        run: |
          python3 scripts/e2e/platforms/manual/redaction_check.py --self-test
          python3 scripts/e2e/platforms/manual/collect_backend_evidence.py --self-test
