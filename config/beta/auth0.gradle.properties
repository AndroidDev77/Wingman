# Wingman private beta: Android Auth0 sign-in settings (I-014).
#
# These are PUBLIC identifiers, NOT secrets: the tenant issuer, the Native app's Client ID (a
# public client with PKCE; it has no client secret), the redirect URI, the API audience and the
# connection name are all visible in every sign-in URL the app opens.
#
# scripts/release/build.sh passes each line as -P<key>=<value> to the beta APK build (an explicit
# -Pwingman.oidc.<key>=... given to build.sh wins; --no-auth0 leaves them all out). Gradle never
# reads this file by itself: debug/dev builds, CI and E2E do not pick these values up.
#
# To change the tenant: edit this file AND config/beta/auth0.env together (the issuer and audience
# must match), then follow docs/auth0.md ("Wingman beta tenant").
# backend/tests/test_beta_auth0_config.py checks the two files agree.
wingman.oidc.issuer=https://dev-zumw4z1t7m8hefst.us.auth0.com/
wingman.oidc.clientId=XYOVrRYWqOQXj2JH5cEyrGTUg0ypq750
wingman.oidc.redirectUri=com.wingman.auth:/oauth2redirect
wingman.oidc.audience=https://api.wingman.app
wingman.oidc.connection=google-oauth2
