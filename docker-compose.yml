services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wingman
      POSTGRES_PASSWORD: wingman   # local dev only; never reuse in deployed envs
      POSTGRES_DB: wingman
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wingman"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    profiles: ["backend"]   # optional: `docker compose --profile backend up`
    build: ./backend
    env_file: [.env]
    environment:
      WINGMAN_DATABASE_URL: postgresql+asyncpg://wingman:wingman@postgres:5432/wingman
      WINGMAN_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  # One-shot: `alembic upgrade head`, then exits. backend and worker start after it.
  migrate:
    profiles: ["backend"]
    build: ./backend
    env_file: [.env]
    environment:
      WINGMAN_DATABASE_URL: postgresql+asyncpg://wingman:wingman@postgres:5432/wingman
    command: ["alembic", "upgrade", "head"]
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  # Periodic jobs (I-015): reply delays / retry backoff (dispatch_due), outbox lease
  # expiry, approval expiry. Same image. It skips `mock` connections (I-016: the mock
  # simulator lives in the API process); see docs/deployment.md "Background worker".
  worker:
    profiles: ["backend"]
    build: ./backend
    env_file: [.env]
    environment:
      WINGMAN_DATABASE_URL: postgresql+asyncpg://wingman:wingman@postgres:5432/wingman
      WINGMAN_WORKER_HEALTH_PORT: "8081"
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
