# Alembic configuration (WING-003). Run from backend/: `uv run alembic upgrade head`.
# The database URL comes from WINGMAN_DATABASE_URL (Settings.database_url) unless
# `sqlalchemy.url` is set programmatically (tests do this).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
